<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>职业兴趣测试 - 霍兰德RIASEC</title>
    <style>
        /* ===== CSS Variables & Reset ===== */
        :root {
            --primary: #4A6CF7;
            --primary-light: #6C8AFF;
            --primary-dark: #3458D6;
            --secondary: #6C63FF;
            --bg: #F0F4FF;
            --card-bg: #FFFFFF;
            --text: #1A2332;
            --text-light: #5A6B7A;
            --shadow: 0 12px 40px rgba(74, 108, 247, 0.12);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --touch-size: 44px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(74, 108, 247, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(108, 99, 255, 0.06) 0%, transparent 60%);
        }

        /* ===== Container ===== */
        .app {
            max-width: 820px;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px 36px;
            position: relative;
            min-height: 90vh;
            transition: all var(--transition);
            margin: 8px 0;
        }

        /* ===== Page ===== */
        .page {
            display: none;
            animation: fadeSlide 0.35s ease forwards;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(14px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Welcome ===== */
        .welcome-icon {
            font-size: 52px;
            text-align: center;
            margin-bottom: 4px;
        }
        .welcome h1 {
            font-size: 30px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .welcome .sub {
            text-align: center;
            font-size: 17px;
            color: var(--text-light);
            margin-top: 4px;
            font-weight: 400;
        }
        .welcome .desc {
            margin: 24px 0 28px;
            background: var(--bg);
            padding: 20px 22px;
            border-radius: var(--radius-sm);
            line-height: 1.8;
            color: var(--text-light);
            font-size: 15px;
        }
        .welcome .desc strong {
            color: var(--text);
            font-weight: 600;
        }
        .welcome .meta {
            display: flex;
            justify-content: center;
            gap: 12px 20px;
            flex-wrap: wrap;
            margin-bottom: 28px;
            font-size: 14px;
            color: var(--text-light);
        }
        .welcome .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-start {
            display: block;
            width: 100%;
            padding: 18px;
            font-size: 19px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 6px 20px rgba(74, 108, 247, 0.35);
            min-height: var(--touch-size);
        }
        .btn-start:active {
            transform: scale(0.96);
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.25);
        }

        /* ===== Test ===== */
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-bottom: 14px;
        }
        .test-header .section-label {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .test-header .section-label .icon {
            font-size: 24px;
        }
        .test-header .progress-text {
            font-size: 14px;
            color: var(--text-light);
            background: var(--bg);
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: 500;
            white-space: nowrap;
        }

        .progress-bar-wrap {
            width: 100%;
            height: 6px;
            background: #E8EDF5;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .section-desc {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 20px;
            padding: 12px 16px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--primary);
        }

        .question-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
            /* 移除固定高度限制，让页面自然滚动 */
            max-height: none;
            overflow: visible;
            padding-right: 0;
        }

        .q-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #FAFBFD;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid transparent;
            transition: border-color 0.2s, background 0.2s;
        }
        .q-item:hover {
            background: #F5F8FF;
        }
        .q-item.answered {
            border-color: var(--primary-light);
            background: #F5F8FF;
        }

        .q-num {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-light);
            min-width: 30px;
            flex-shrink: 0;
        }
        .q-text {
            flex: 1;
            font-size: 16px;
            line-height: 1.5;
        }
        .q-options {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            margin-left: 4px;
        }
        .q-options button {
            padding: 6px 18px;
            border: 1.5px solid #D0D8E8;
            border-radius: 30px;
            background: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-light);
            font-family: var(--font);
            min-height: var(--touch-size);
            min-width: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .q-options button:active {
            transform: scale(0.94);
        }
        .q-options button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .q-options button.active-yes {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .q-options button.active-no {
            background: #E74C5E;
            border-color: #E74C5E;
            color: #fff;
        }
        .q-options button.active-yes:active,
        .q-options button.active-no:active {
            opacity: 0.8;
        }

        .test-footer {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .test-footer button {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: var(--font);
            min-height: var(--touch-size);
            touch-action: manipulation;
            flex: 1;
            min-width: 100px;
        }
        .test-footer button:active {
            transform: scale(0.96);
        }
        .btn-prev {
            background: #E8EDF5;
            color: var(--text-light);
        }
        .btn-prev:active:not(:disabled) {
            background: #D5DDEA;
        }
        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-next {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 14px rgba(74, 108, 247, 0.3);
        }
        .btn-next:active:not(:disabled) {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(74, 108, 247, 0.25);
        }
        .btn-next:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== Result ===== */
        .result h2 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2px;
        }
        .result .result-sub {
            text-align: center;
            color: var(--text-light);
            font-size: 16px;
            margin-bottom: 24px;
        }

        .result-code {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .result-code .code-letter {
            font-size: 34px;
            font-weight: 800;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: var(--bg);
            color: var(--primary);
            border: 2px solid var(--primary-light);
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.08);
        }
        .result-code .code-letter.high {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            border-color: transparent;
        }

        .chart-wrap {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 20px 16px 16px;
            margin-bottom: 24px;
        }
        .chart {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chart-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chart-label {
            width: 32px;
            font-weight: 700;
            font-size: 16px;
            text-align: right;
            flex-shrink: 0;
        }
        .chart-label .label-icon {
            font-size: 18px;
        }
        .chart-bar-wrap {
            flex: 1;
            height: 28px;
            background: #E8EDF5;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
        }
        .chart-bar {
            height: 100%;
            border-radius: 14px;
            width: 0%;
            transition: width 1s ease;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            min-width: 0;
        }
        .chart-bar .bar-val {
            opacity: 0;
            transition: opacity 0.4s 0.6s;
        }
        .chart-bar.anim .bar-val {
            opacity: 1;
        }
        .chart-score {
            width: 28px;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-light);
            text-align: left;
            flex-shrink: 0;
        }

        .result-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 20px;
        }
        .detail-card {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 16px 16px;
            border-left: 4px solid var(--primary);
            transition: transform 0.15s;
        }
        .detail-card:active {
            transform: scale(0.98);
        }
        .detail-card .d-title {
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .detail-card .d-desc {
            font-size: 14px;
            color: var(--text-light);
            margin: 4px 0 6px;
            line-height: 1.5;
        }
        .detail-card .d-jobs {
            font-size: 14px;
            color: var(--text);
            line-height: 1.6;
        }
        .detail-card .d-jobs strong {
            color: var(--primary);
        }

        .btn-restart {
            display: block;
            width: 100%;
            padding: 16px;
            margin-top: 28px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 17px;
            font-weight: 600;
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
            font-family: var(--font);
            min-height: var(--touch-size);
            touch-action: manipulation;
        }
        .btn-restart:active {
            background: #DCE4F0;
            transform: scale(0.97);
        }

        /* ============================================================ */
        /* ===== 移动端专项优化 (Mobile First) ===== */
        /* ============================================================ */

        /* 小屏手机 (<= 480px) 及 平板竖屏 (<= 640px) */
        @media (max-width: 640px) {
            body {
                padding: 8px;
                align-items: flex-start;
            }
            .app {
                padding: 20px 16px;
                border-radius: 16px;
                min-height: 95vh;
                margin: 4px 0;
                box-shadow: 0 6px 24px rgba(74, 108, 247, 0.10);
            }

            /* 欢迎页 */
            .welcome h1 {
                font-size: 26px;
            }
            .welcome .desc {
                padding: 16px 18px;
                font-size: 14px;
                margin: 18px 0 22px;
            }
            .welcome .meta {
                gap: 8px 14px;
                font-size: 13px;
            }
            .btn-start {
                font-size: 17px;
                padding: 16px;
            }

            /* 测试页 */
            .test-header .section-label {
                font-size: 18px;
            }
            .test-header .section-label .icon {
                font-size: 20px;
            }
            .test-header .progress-text {
                font-size: 13px;
                padding: 2px 12px;
            }

            /* 题目卡片 - 移动端专属布局 */
            .q-item {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                padding: 14px 14px;
            }
            .q-num {
                font-size: 13px;
                min-width: auto;
            }
            .q-text {
                width: 100%;
                font-size: 16px;
                order: 0;
                padding-right: 4px;
            }
            .q-options {
                order: 1;
                width: 100%;
                justify-content: flex-start;
                gap: 12px;
                margin-left: 0;
            }
            .q-options button {
                flex: 1;
                max-width: 140px;
                padding: 10px 12px;
                font-size: 16px;
                min-height: 48px;
                border-radius: 30px;
            }

            /* 导航按钮 - 移动端纵向堆叠 */
            .test-footer {
                flex-direction: column;
                gap: 10px;
            }
            .test-footer button {
                width: 100%;
                flex: none;
                min-width: unset;
                padding: 14px;
                font-size: 16px;
                border-radius: var(--radius-sm);
            }
            /* 让“下一部分”按钮在顶部，更符合操作流 */
            .btn-prev {
                order: 1;
            }
            .btn-next {
                order: 0;
            }

            /* 移除列表滚动限制，保证自然滚动 */
            .question-list {
                gap: 8px;
                margin-bottom: 18px;
            }

            /* 结果页 */
            .result h2 {
                font-size: 24px;
            }
            .result-code .code-letter {
                width: 56px;
                height: 56px;
                font-size: 28px;
                border-radius: 14px;
            }
            .chart-wrap {
                padding: 16px 12px 12px;
            }
            .chart-row {
                gap: 6px;
            }
            .chart-label {
                width: 28px;
                font-size: 14px;
            }
            .chart-label .label-icon {
                font-size: 16px;
            }
            .chart-bar-wrap {
                height: 26px;
            }
            .chart-bar {
                font-size: 12px;
                padding-right: 8px;
            }
            .chart-score {
                width: 24px;
                font-size: 14px;
            }

            .result-details {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .detail-card {
                padding: 14px 14px;
            }
            .detail-card .d-title {
                font-size: 15px;
            }
            .btn-restart {
                font-size: 16px;
                padding: 14px;
                margin-top: 22px;
            }
        }

        /* 超小屏手机 (<= 380px) 进一步微调 */
        @media (max-width: 380px) {
            .app {
                padding: 14px 10px;
            }
            .q-item {
                padding: 12px 10px;
            }
            .q-options button {
                max-width: 100px;
                padding: 8px 8px;
                font-size: 15px;
                min-height: 44px;
            }
            .q-text {
                font-size: 15px;
            }
            .result-code .code-letter {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }
            .chart-label {
                width: 24px;
                font-size: 12px;
            }
            .chart-score {
                width: 20px;
                font-size: 12px;
            }
        }

        /* 横屏手机提示 (可选) */
        @media (max-height: 500px) and (orientation: landscape) {
            .app {
                padding: 12px 16px;
                min-height: auto;
            }
            .question-list {
                gap: 6px;
            }
            .q-item {
                padding: 8px 12px;
            }
            .q-options button {
                min-height: 36px;
                padding: 4px 14px;
            }
            .test-header {
                margin-bottom: 8px;
            }
            .section-desc {
                margin-bottom: 10px;
                padding: 8px 14px;
            }
            .test-footer button {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- ===== WELCOME ===== -->
        <div class="page welcome active" id="page-welcome">
            <div class="welcome-icon">🧭</div>
            <h1>职业兴趣测试</h1>
            <p class="sub">探索你的职业兴趣和倾向，找到最适合你的职业发展方向</p>
            <div class="desc">
                <strong>📋 测试说明</strong><br />
                本测试基于 <strong>霍兰德职业兴趣理论（RIASEC模型）</strong>，共 <strong>60 题</strong>，涵盖六个核心维度。<br />
                请根据你的真实感受作答，每题选择“是”或“否”，不必过多犹豫。<br />
                <span style="display:inline-block;margin-top:8px;">⏱ 推荐时长 <strong>20 分钟</strong> &nbsp;·&nbsp; 📊 共 6 个部分</span>
            </div>
            <div class="meta">
                <span>🔧 R</span>
                <span>🔬 I</span>
                <span>🎨 A</span>
                <span>🤝 S</span>
                <span>📈 E</span>
                <span>📋 C</span>
            </div>
            <button class="btn-start" id="btnStart">开始测试 →</button>
        </div>

        <!-- ===== TEST ===== -->
        <div class="page" id="page-test">
            <div class="test-header">
                <div class="section-label">
                    <span class="icon" id="sectionIcon">🔧</span>
                    <span id="sectionTitle">现实型</span>
                </div>
                <div class="progress-text" id="progressText">0 / 60</div>
            </div>
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="section-desc" id="sectionDesc">喜欢动手操作、与物打交道、务实具体</div>

            <div class="question-list" id="questionList"></div>

            <div class="test-footer">
                <button class="btn-prev" id="btnPrev" disabled>← 上一部分</button>
                <button class="btn-next" id="btnNext" disabled>下一部分 →</button>
            </div>
        </div>

        <!-- ===== RESULT ===== -->
        <div class="page result" id="page-result">
            <h2>📊 你的测试结果</h2>
            <p class="result-sub">以下是你六个维度的兴趣倾向得分</p>

            <div class="result-code" id="resultCode"></div>

            <div class="chart-wrap">
                <div class="chart" id="chartContainer"></div>
            </div>

            <div class="result-details" id="resultDetails"></div>

            <button class="btn-restart" id="btnRestart">🔄 重新测试</button>
        </div>
    </div>

    <script>
        // ================================================================
        // DATA
        // ================================================================
        const SECTIONS = [{
            id: 'R',
            icon: '🔧',
            name: '现实型',
            desc: '喜欢动手操作、与物打交道、务实具体',
            questions: [
                '我喜欢动手操作工具、机器或设备',
                '我擅长修理家具、电器或机械',
                '我喜欢户外工作或体力活动',
                '我更喜欢和"物"打交道，而非"人"',
                '我享受亲手制作或建造东西的过程',
                '我善于使用各种工具和仪器',
                '我对汽车、机械或工程类话题感兴趣',
                '我做事踏实，不喜欢过于理论化',
                '我喜欢具体、明确的任务',
                '我动手能力比动脑能力强（或相当）'
            ]
        }, {
            id: 'I',
            icon: '🔬',
            name: '研究型',
            desc: '喜欢探索规律、独立思考、解决复杂问题',
            questions: [
                '我喜欢探索事物的原因和规律',
                '我对科学发现和理论研究感兴趣',
                '我喜欢独立思考和深度分析问题',
                '我愿意花时间解决复杂的智力难题',
                '我善于观察和提出假设',
                '我对数学、物理或生物等学科有兴趣',
                '我喜欢阅读和研究，而非实际操作',
                '我享受抽象思维和理论构建',
                '我常问"为什么"，对未知充满好奇',

        }, {

                '我乐于展示自己的作品或表演',

            ]
        }, {

            name: '社会型',
            desc: '善于沟通、乐于助人、关注他人福祉',
            questions: [

                '我乐于教导、指导或照顾他人',

                '我常被朋友视为"知心人"',
                '我关注社会福祉和公益事业',
                '我有较强的同理心和共情力',
                '我热衷于参加社团、志愿或社区活动'
            ]
        }, {
            id: 'E',
            icon: '📈',
            name: '企业型',
            desc: '有领导力、善于说服、追求成就和影响力',
            questions: [
                '我渴望领导、影响和说服他人',
                '我富有竞争力和进取心',
                '我善于制定计划和设定目标',
                '我有较强的组织和管理能力',
                '我善于推销想法或产品',
                '我渴望获得权力、地位或经济回报',
                '我喜欢冒险和挑战',
                '我擅长决策和承担风险',
                '我精力充沛，喜欢掌控局面',
                '我更关注结果而非过程'
            ]
        }, {
            id: 'C',
            icon: '📋',
            name: '常规型',
            desc: '细致有序、可靠、喜欢规则明确的工作',
            questions: [
                '我喜欢有序、整洁的工作环境',
                '我擅长整理数据、文档和资料',
                '我注重细节和准确性',
                '我偏好有明确规则和流程的工作',
                '我做事认真、可靠、守时',
                '我喜欢按部就班的工作方式',
                '我对财务、统计或办公事务感兴趣',
                '我倾向于稳定、可预期的工作',
                '我能高效地完成重复性任务',
                '我喜欢做计划和清单'
            ]
        }];

        const TYPE_INFO = {
            R: {
                name: '现实型',
                icon: '🔧',
                desc: '务实、坦率、动手能力强，喜欢与物打交道和户外活动。',
                jobs: '工程师（机械/电气/土木）、技术员、建筑师、飞行员、消防员、园艺师、厨师'
            },
            I: {
                name: '研究型',
                icon: '🔬',
                desc: '好奇、独立、分析力强，喜欢理论和抽象思考，探索未知。',
                jobs: '科学家、研究员、数据分析师、大学教授、医生、药剂师、算法工程师'
            },
            A: {
                name: '艺术型',
                icon: '🎨',
                desc: '富有想象力、感性、追求美和自由表达，喜欢非结构化环境。',
                jobs: '设计师（平面/室内/服装）、作家、编剧、音乐家、画家、摄影师、广告创意'
            },
            S: {
                name: '社会型',
                icon: '🤝',
                desc: '友善、善解人意、善于沟通，关注他人福祉和社会议题。',
                jobs: '教师、心理咨询师、社工、医生、护士、人力资源、公关、公益组织'
            },
            E: {
                name: '企业型',
                icon: '📈',
                desc: '自信、进取、有领导力，善于说服和决策，追求成就。',
                jobs: '企业家、管理者、项目经理、销售总监、投资顾问、律师、经纪人'
            },
            C: {
                name: '常规型',
                icon: '📋',
                desc: '细致、有序、可靠，善于整理和执行，偏好稳定可预期。',
                jobs: '会计、审计师、银行职员、行政助理、税务师、保险专员、办公室管理'
            }
        };

        // ================================================================
        // STATE
        // ================================================================
        let answers = {};
        let currentSection = 0;

        // ================================================================
        // DOM REFS
        // ================================================================
        const $ = id => document.getElementById(id);
        const pageWelcome = $('page-welcome');
        const pageTest = $('page-test');
        const pageResult = $('page-result');
        const btnStart = $('btnStart');
        const sectionIcon = $('sectionIcon');
        const sectionTitle = $('sectionTitle');
        const sectionDesc = $('sectionDesc');
        const progressText = $('progressText');
        const progressFill = $('progressFill');
        const questionList = $('questionList');
        const btnPrev = $('btnPrev');
        const btnNext = $('btnNext');
        const resultCode = $('resultCode');
        const chartContainer = $('chartContainer');
        const resultDetails = $('resultDetails');
        const btnRestart = $('btnRestart');

        // ================================================================
        // HELPERS
        // ================================================================
        function getTotalQuestions() {
            return SECTIONS.reduce((sum, s) => sum + s.questions.length, 0);
        }

        function getAnsweredCount() {
            let count = 0;
            for (let si = 0; si < SECTIONS.length; si++) {
                const qs = SECTIONS[si].questions;
                for (let qi = 0; qi < qs.length; qi++) {
                    const key = `${si}-${qi}`;
                    if (answers[key] !== undefined) count++;
                }
            }
            return count;
        }

        function isSectionComplete(si) {
            const qs = SECTIONS[si].questions;
            for (let qi = 0; qi < qs.length; qi++) {
                const key = `${si}-${qi}`;
                if (answers[key] === undefined) return false;
            }
            return true;
        }

        function getSectionScore(si) {
            const qs = SECTIONS[si].questions;
            let score = 0;
            for (let qi = 0; qi < qs.length; qi++) {
                const key = `${si}-${qi}`;
                if (answers[key] === true) score++;
            }
            return score;
        }

        function getScores() {
            return SECTIONS.map((_, i) => getSectionScore(i));
        }

        function getTopThree() {
            const scores = getScores();
            const indexed = scores.map((s, i) => ({ idx: i, score: s }));
            indexed.sort((a, b) => b.score - a.score);
            return indexed.slice(0, 3).map(item => ({
                idx: item.idx,
                id: SECTIONS[item.idx].id,
                score: item.score
            }));
        }

        // ================================================================
        // RENDER: TEST
        // ================================================================
        function renderTest() {
            const si = currentSection;
            const section = SECTIONS[si];
            const qs = section.questions;

            sectionIcon.textContent = section.icon;
            sectionTitle.textContent = `${section.name} (${si+1}/${SECTIONS.length})`;
            sectionDesc.textContent = section.desc;

            const total = getTotalQuestions();
            const done = getAnsweredCount();
            progressText.textContent = `${done} / ${total}`;
            progressFill.style.width = `${(done / total) * 100}%`;

            let html = '';
            qs.forEach((q, qi) => {
                const key = `${si}-${qi}`;
                const val = answers[key];
                let yesActive = val === true ? 'active-yes' : '';
                let noActive = val === false ? 'active-no' : '';
                const answered = val !== undefined;
                html += `
                    <div class="q-item ${answered ? 'answered' : ''}" data-qi="${qi}">
                        <span class="q-num">${qi + 1}.</span>
                        <span class="q-text">${q}</span>
                        <div class="q-options">
                            <button class="${yesActive}" data-action="yes" data-qi="${qi}">是</button>
                            <button class="${noActive}" data-action="no" data-qi="${qi}">否</button>
                        </div>
                    </div>
                `;
            });
            questionList.innerHTML = html;

            questionList.querySelectorAll('.q-options button').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const qi = parseInt(this.dataset.qi);
                    const action = this.dataset.action;
                    const key = `${si}-${qi}`;
                    const val = action === 'yes' ? true : false;

                    if (answers[key] === val) return;

                    answers[key] = val;
                    renderTest();
                });
            });

            const complete = isSectionComplete(si);
            btnNext.disabled = !complete;
            if (si === SECTIONS.length - 1) {
                btnNext.textContent = '📊 查看结果';
            } else {
                btnNext.textContent = '下一部分 →';
            }
            btnPrev.disabled = (si === 0);

            // 滚动到题目列表顶部
            if (questionList.scrollTop > 0) {
                questionList.scrollTop = 0;
            }
            // 在移动端，平滑滚动到测试区域顶部
            const testEl = document.getElementById('page-test');
            if (testEl && window.innerWidth <= 640) {
                // 仅在点击选项后轻微滚动，确保按钮可见
            }
        }

        // ================================================================
        // RENDER: RESULT
        // ================================================================
        function renderResult() {
            const scores = getScores();
            const top3 = getTopThree();

            let codeHtml = '';
            top3.forEach((item, idx) => {
                const sec = SECTIONS[item.idx];
                const cls = idx === 0 ? 'code-letter high' : 'code-letter';
                codeHtml += `<div class="${cls}">${sec.icon} ${sec.id}</div>`;
            });
            resultCode.innerHTML = codeHtml;

            const maxScore = 10;
            const colors = ['#4A6CF7', '#6C63FF', '#FF6B8A', '#4ECDC4', '#FFB347', '#A8A8A8'];
            let chartHtml = '';
            SECTIONS.forEach((sec, i) => {
                const pct = (scores[i] / maxScore) * 100;
                const color = colors[i % colors.length];
                chartHtml += `
                    <div class="chart-row">
                        <div class="chart-label"><span class="label-icon">${sec.icon}</span></div>
                        <div class="chart-bar-wrap">
                            <div class="chart-bar anim" style="width:${pct}%;background:${color};">
                                <span class="bar-val">${scores[i]}</span>
                            </div>
                        </div>
                        <div class="chart-score">${scores[i]}</div>
                    </div>
                `;
            });
            chartContainer.innerHTML = chartHtml;

            let detailHtml = '';
            SECTIONS.forEach((sec, i) => {
                const info = TYPE_INFO[sec.id];
                const score = scores[i];
                const isTop = top3.some(t => t.idx === i);
                detailHtml += `
                    <div class="detail-card" style="border-left-color: ${isTop ? '#4A6CF7' : '#CBD5E1'};">
                        <div class="d-title">${sec.icon} ${sec.name} <span style="color:var(--text-light);font-weight:400;font-size:14px;">(${score}/10)</span></div>
                        <div class="d-desc">${info.desc}</div>
                        <div class="d-jobs"><strong>推荐职业：</strong>${info.jobs}</div>
                    </div>
                `;
            });
            resultDetails.innerHTML = detailHtml;

            showPage('page-result');
        }

        // ================================================================
        // PAGE NAVIGATION
        // ================================================================
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const el = document.getElementById(id);
            if (el) el.classList.add('active');
            // 滚动到顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goToSection(si) {
            if (si < 0 || si >= SECTIONS.length) return;
            currentSection = si;
            showPage('page-test');
            renderTest();
        }

        function goNext() {
            if (!isSectionComplete(currentSection)) return;
            if (currentSection === SECTIONS.length - 1) {
                renderResult();
            } else {
                goToSection(currentSection + 1);
            }
        }

        function goPrev() {
            if (currentSection > 0) {
                goToSection(currentSection - 1);
            }
        }

        // ================================================================
        // EVENT BINDING
        // ================================================================
        btnStart.addEventListener('click', () => {
            answers = {};
            currentSection = 0;
            goToSection(0);
        });

        btnNext.addEventListener('click', goNext);
        btnPrev.addEventListener('click', goPrev);

        btnRestart.addEventListener('click', () => {
            answers = {};
            currentSection = 0;
            showPage('page-welcome');
            document.querySelectorAll('.chart-bar').forEach(el => el.classList.remove('anim'));
            // 重置进度条
            progressFill.style.width = '0%';
        });

        // 键盘支持 (桌面端)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Enter') {
                if (pageTest.classList.contains('active') && !btnNext.disabled) {
                    goNext();
                }
            }
            if (e.key === 'ArrowLeft') {
                if (pageTest.classList.contains('active') && !btnPrev.disabled) {
                    goPrev();
                }
            }
        });

        // ================================================================
        // INIT
        // ================================================================
        showPage('page-welcome');
        console.log('🧭 职业兴趣测试已加载 (移动端优化版)');
        console.log(`📚 共 ${getTotalQuestions()} 题，${SECTIONS.length} 个维度`);
    </script>
