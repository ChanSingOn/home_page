<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>爱情观念与恋爱风格 · 移动优化版</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #fdf2f4 0%, #f8e8ed 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 780px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 40px;
            padding: 28px 24px 36px;
            box-shadow: 0 30px 60px rgba(180, 100, 120, 0.18),
                0 12px 28px rgba(180, 100, 120, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            position: relative;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 2px solid rgba(210, 150, 170, 0.2);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #4a2c38;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #b34a6a, #d4738c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .sub {
            font-size: 13px;
            color: #8a6a78;
            margin-top: 4px;
            -webkit-text-fill-color: #8a6a78;
        }

        /* ===== 主页 ===== */
        #homePage {
            text-align: center;
            padding: 20px 0 10px;
            animation: fadeUp 0.5s ease;
        }

        #homePage .desc {
            font-size: 16px;
            color: #3d2a32;
            line-height: 1.8;
            margin: 16px 0 28px;
            padding: 0 4px;
        }

        #homePage .desc strong {
            color: #b34a6a;
        }

        .btn-start {
            background: #b34a6a;
            color: #fff;
            border: none;
            border-radius: 60px;
            padding: 16px 48px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 8px 28px rgba(179, 74, 106, 0.35);
            cursor: pointer;
            transition: all 0.25s ease;
            touch-action: manipulation;
            min-height: 60px;
        }

        .btn-start:active {
            transform: scale(0.95);
            background: #9e3d5b;
        }

        /* ===== 进度条 ===== */
        .progress-area {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: #f0e0e6;
            border-radius: 12px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d4738c, #b34a6a);
            border-radius: 12px;
            transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .progress-text {
            font-size: 15px;
            font-weight: 600;
            color: #4a2c38;
            min-width: 68px;
            text-align: right;
        }

        /* ===== 题目卡片 ===== */
        .question-area {
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            animation: fadeSlide 0.3s ease;
        }

        .question-area.hidden,
        .result-page.hidden,
        #homePage.hidden,
        .progress-area.hidden {
            display: none !important;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .q-number {
            font-size: 13px;
            font-weight: 600;
            color: #b34a6a;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .q-text {
            font-size: 20px;
            font-weight: 600;
            color: #2d1c24;
            line-height: 1.5;
            margin-bottom: 22px;
            padding-right: 4px;
        }

        /* ===== 选项 ===== */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: rgba(255, 247, 249, 0.7);
            border: 2px solid #f0dce4;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            color: #3d2a32;
            font-weight: 450;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(180, 100, 120, 0.04);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-height: 56px;
            user-select: none;
        }

        .option-btn:active:not(.selected) {
            transform: scale(0.97);
            background: #fceef2;
        }

        .option-btn .letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #f0dce4;
            color: #5a3a48;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .option-btn.selected {
            border-color: #b34a6a;
            background: #fbeaf0;
            box-shadow: 0 4px 14px rgba(179, 74, 106, 0.18);
        }

        .option-btn.selected .letter {
            background: #b34a6a;
            color: #fff;
        }

        .option-btn:active.selected {
            transform: scale(0.97);
        }

        /* ===== 底部导航 ===== */
        .nav-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 18px;
            border-top: 2px solid rgba(210, 150, 170, 0.15);
        }

        .nav-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            background: #f0dce4;
            color: #5a3a48;
            min-width: 100px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-height: 48px;
        }

        .nav-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .nav-btn.primary {
            background: #b34a6a;
            color: #fff;
            box-shadow: 0 6px 18px rgba(179, 74, 106, 0.28);
        }

        .nav-btn.primary:active:not(:disabled) {
            background: #9e3d5b;
            transform: scale(0.96);
        }

        .nav-btn.primary:disabled {
            background: #c9a0b0;
            box-shadow: none;
        }

        /* ===== 结果页 ===== */
        .result-page {
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(28px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            font-size: 24px;
            font-weight: 700;
            color: #4a2c38;
            text-align: center;
            margin-bottom: 2px;
        }

        .result-sub {
            text-align: center;
            color: #8a6a78;
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* 条形图 */
        .chart {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
            background: rgba(255, 247, 249, 0.4);
            padding: 18px 20px;
            border-radius: 28px;
            border: 1px solid rgba(210, 150, 170, 0.15);
        }

        .chart-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-label {
            width: 72px;
            font-size: 13px;
            font-weight: 600;
            color: #4a2c38;
            flex-shrink: 0;
        }

        .chart-bar-bg {
            flex: 1;
            height: 22px;
            background: #f0e0e6;
            border-radius: 40px;
            overflow: hidden;
            position: relative;
        }

        .chart-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 40px;
            transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .chart-bar-fill.a { background: linear-gradient(90deg, #e89bb0, #d4738c); }
        .chart-bar-fill.b { background: linear-gradient(90deg, #f5b07a, #e8926a); }
        .chart-bar-fill.c { background: linear-gradient(90deg, #8fc1b5, #6daa9a); }
        .chart-bar-fill.d { background: linear-gradient(90deg, #a897c0, #8b78aa); }

        .chart-value {
            width: 40px;
            font-size: 15px;
            font-weight: 700;
            color: #3d2a32;
            text-align: right;
            flex-shrink: 0;
        }

        /* 主要类型标签 */
        .main-type-badge {
            display: inline-block;
            padding: 8px 28px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin: 0 auto 18px;
            text-align: center;
            background: #b34a6a;
            box-shadow: 0 6px 20px rgba(179, 74, 106, 0.25);
            letter-spacing: 0.5px;
        }

        .main-type-badge.a { background: linear-gradient(135deg, #d4738c, #b34a6a); }
        .main-type-badge.b { background: linear-gradient(135deg, #e8926a, #d4784a); }
        .main-type-badge.c { background: linear-gradient(135deg, #6daa9a, #4d8e7e); }
        .main-type-badge.d { background: linear-gradient(135deg, #8b78aa, #6d5a8a); }

        /* 解读卡片 */
        .interpretation {
            background: rgba(255, 247, 249, 0.5);
            border-radius: 28px;
            padding: 20px 22px;
            border: 1px solid rgba(210, 150, 170, 0.12);
            margin-top: 6px;
        }

        .interpretation h3 {
            font-size: 17px;
            color: #4a2c38;
            margin-bottom: 8px;
        }

        .interpretation h3 span {
            font-weight: 400;
            color: #8a6a78;
            font-size: 14px;
        }

        .interpretation p {
            font-size: 15px;
            color: #3d2a32;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .interpretation .highlight {
            background: #fbeaf0;
            padding: 12px 16px;
            border-radius: 16px;
            border-left: 4px solid #b34a6a;
            font-size: 14px;
            color: #4a2c38;
            margin-top: 6px;
        }

        .interpretation .highlight strong {
            color: #b34a6a;
        }

        .result-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .result-actions .nav-btn {
            min-width: 140px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .container { padding: 20px 16px 28px; border-radius: 32px; }
            .header h1 { font-size: 20px; }
            .q-text { font-size: 17px; margin-bottom: 18px; }
            .option-btn { padding: 14px 16px; font-size: 14px; gap: 12px; border-radius: 16px; min-height: 52px; }
            .option-btn .letter { width: 30px; height: 30px; font-size: 13px; }
            .nav-btn { padding: 10px 16px; font-size: 14px; min-width: 80px; min-height: 44px; }
            .chart { padding: 12px 14px; gap: 10px; }
            .chart-label { width: 62px; font-size: 12px; }
            .chart-value { width: 34px; font-size: 13px; }
            .chart-bar-bg { height: 18px; }
            .result-title { font-size: 20px; }
            .interpretation { padding: 14px 16px; }
            .interpretation p { font-size: 14px; }
            .main-type-badge { font-size: 16px; padding: 6px 20px; }
            .btn-start { font-size: 18px; padding: 14px 36px; min-height: 54px; }
            #homePage .desc { font-size: 15px; }
        }

        @media (max-width: 420px) {
            .container { padding: 16px 12px 20px; border-radius: 24px; }
            .q-text { font-size: 15px; }
            .option-btn { font-size: 13px; padding: 12px 12px; gap: 10px; min-height: 46px; border-radius: 14px; }
            .option-btn .letter { width: 26px; height: 26px; font-size: 12px; }
            .nav-btn { font-size: 12px; padding: 8px 12px; min-width: 64px; min-height: 40px; }
            .progress-text { font-size: 13px; min-width: 56px; }
            .chart-label { width: 54px; font-size: 11px; }
            .chart-value { width: 30px; font-size: 12px; }
            .chart-bar-bg { height: 16px; }
            .result-title { font-size: 18px; }
            .btn-start { font-size: 16px; padding: 12px 28px; min-height: 48px; }
            #homePage .desc { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">

        <!-- 头部 -->
        <div class="header">
            <h1>❤️ 爱情观念与恋爱风格</h1>
            <div class="sub">30 题 · 约 12 分钟 · 了解你的亲密关系模式</div>
        </div>

        <!-- ===== 主页 ===== -->
        <div id="homePage">
            <div class="desc">
                <strong>欢迎参加本次心理测试</strong><br /><br />
                本测试基于爱情色彩理论与依恋理论，通过 30 道情境式选择题，<br />
                帮助您深入了解自己在亲密关系中的 <strong>行为模式</strong>、<strong>核心需求</strong> 与 <strong>潜在盲点</strong>。<br /><br />
                请根据真实感受选择最符合自己的选项，<strong>答案无对错</strong>，只需凭直觉作答。<br />
                测试结束后将为您生成详细的个人风格解析与成长建议。
            </div>
            <button class="btn-start" id="startBtn">开始测试 →</button>
        </div>

        <!-- ===== 进度条 ===== -->
        <div class="progress-area hidden" id="progressArea">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">1 / 30</div>
        </div>

        <!-- ===== 题目区 ===== -->
        <div class="question-area hidden" id="questionArea">
            <div class="q-number" id="qNumber">第 1 题</div>
            <div class="q-text" id="qText">加载题目...</div>
            <div class="options" id="optionsContainer"></div>

            <div class="nav-area">
                <button class="nav-btn" id="prevBtn" disabled>上一题</button>
                <button class="nav-btn primary" id="nextBtn">下一题</button>
            </div>
        </div>

        <!-- ===== 结果区 ===== -->
        <div class="result-page hidden" id="resultPage">
            <div class="result-title">✨ 你的爱情风格解析</div>
            <div class="result-sub">基于你的选择，以下是你在四个维度上的倾向</div>

            <div class="chart" id="chartContainer"></div>

            <div style="text-align:center;">
                <div class="main-type-badge" id="mainTypeBadge">—</div>
            </div>

            <div class="interpretation" id="interpretationContainer"></div>

            <div class="result-actions">
                <button class="nav-btn" id="restartBtn">🔄 重新测试</button>
            </div>
        </div>

    </div>

    <script>
        // ================================================================
        //  1. 题目数据（30 题，四个维度均衡分布）
        // ================================================================
        const QUESTIONS = [{
            id: 1,
            text: '当你对某人产生好感时，你通常会：',
            options: [
                { text: '默默观察，分析我们是否合适，很难主动出击。', type: 'A' },
                { text: '感觉自己被强烈的化学反应和直觉「击中」，难以自拔。', type: 'B' },
                { text: '先尝试和对方成为朋友，从日常相处中慢慢培养感觉。', type: 'C' },
                { text: '会考虑对方的家世、学历、职业前景是否与我的规划匹配。', type: 'D' }
            ]
        }, {
            id: 2,
            text: '你认为最理想的相识方式是：',
            options: [
                { text: '通过工作或学习中的长期合作，逐渐发现彼此的闪光点。', type: 'A' },
                { text: '一见钟情，在某个充满激情的场合（如音乐节、旅途）突然相遇。', type: 'B' },
                { text: '通过共同的朋友圈子自然认识，有相似的生活轨迹。', type: 'C' },
                { text: '通过目的明确的相亲或婚恋网站，优先筛选硬性条件。', type: 'D' }
            ]
        }, {
            id: 3,
            text: '在确定关系前，你一般会：',
            options: [
                { text: '非常谨慎，需要确认对方是「安全可靠」的，会反复测试对方是否真心。', type: 'A' },
                { text: '跟着感觉走，如果感觉对了，不在乎外界看法，会很快投入。', type: 'B' },
                { text: '顺其自然，不强求，相信如果有缘分自然会在一起。', type: 'C' },
                { text: '做一个详细的对比分析，权衡利弊后再做决定。', type: 'D' }
            ]
        }, {
            id: 4,
            text: '周末你们没有特别安排，你会倾向于：',
            options: [
                { text: '提前规划好一个具体的时间表，享受有序的共处。', type: 'A' },
                { text: '心血来潮，拉上伴侣去尝试新鲜刺激的事情（如跳伞、新开的密室）。', type: 'B' },
                { text: '宅在家里各做各的事，偶尔闲聊两句，享受平静的陪伴感。', type: 'C' },
                { text: '讨论一下这周谁做的家务多，是否应该调整一下家庭贡献值。', type: 'D' }
            ]
        }, {
            id: 5,
            text: '当你遇到巨大的工作压力时，你第一反应是：',
            options: [
                { text: '需要伴侣给我一个拥抱和安慰，帮我平复情绪。', type: 'A' },
                { text: '把自己关起来处理完情绪，不想把负能量传递给伴侣。', type: 'B' },
                { text: '把烦恼讲给伴侣听，虽然不指望TA能解决，但说出来就好多了。', type: 'C' },
                { text: '希望伴侣能帮我分析现状，或者干脆给我介绍个资源解决问题。', type: 'D' }
            ]
        }, {
            id: 6,
            text: '你们因为小事发生争执，你通常会：',
            options: [
                { text: '非常焦虑，急于修复关系，甚至愿意牺牲自己的立场来换取和平。', type: 'A' },
                { text: '情绪激动，声音变大，希望把心里憋着的话全部倒出来争个对错。', type: 'B' },
                { text: '选择冷处理，先各自冷静一下，等情绪过去了再慢慢聊。', type: 'C' },
                { text: '认为争吵是低效的，列出1、2、3点逻辑去说服对方。', type: 'D' }
            ]
        }, {
            id: 7,
            text: '关于「我爱你」这三个字，你觉得：',
            options: [
                { text: '不太容易说出口，因为我觉得行动比承诺更重要，说出来就要负责。', type: 'A' },
                { text: '是感受当下的心情，爱的时候要说，不爱了就是不爱了。', type: 'B' },
                { text: '是感情的稳定基石，说出口意味着我愿意接纳你的全部缺点。', type: 'C' },
                { text: '是建立家庭和长期利益共同体的开始，不仅是对人，也是对未来的承诺。', type: 'D' }
            ]
        }, {
            id: 8,
            text: '看到伴侣和异性单独吃饭，你的内心活动是：',
            options: [
                { text: '极度不安，会忍不住一直发消息询问，或者事后查手机。', type: 'A' },
                { text: '虽然有点醋意，但反而觉得这增加了征服欲和刺激感。', type: 'B' },
                { text: '给予完全信任，除非伴侣亲口承认，否则不会多想。', type: 'C' },
                { text: '会委婉地提醒伴侣注意边界感，因为这涉及到我们共同的社交形象。', type: 'D' }
            ]
        }, {
            id: 9,
            text: '你对亲密关系中「个人空间」的看法是：',
            options: [
                { text: '我希望两个人越紧密越好，最好形影不离，留空间意味着疏远。', type: 'A' },
                { text: '我需要绝对自由，如果感到被束缚我会想逃离这段关系。', type: 'B' },
                { text: '需要一定的独立空间来做自己的事，但也知道家永远是港湾。', type: 'C' },
                { text: '只要不影响共同的生活计划和目标，个人空间可以协商分配。', type: 'D' }
            ]
        }, {
            id: 10,

            progressText.textContent = '完成 ✓';
        }

        // ================================================================
        //  6. 渲染函数
        // ================================================================
        function renderQuestion(index) {
            const q = QUESTIONS[index];
            qNumber.textContent = `第 ${index + 1} 题`;
            qText.textContent = q.text;

            const letters = ['A', 'B', 'C', 'D'];
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                if (state.answers[index] === opt.type) {
                    btn.classList.add('selected');
                }
                btn.innerHTML = `
                    <span class="letter">${letters[i]}</span>
                    <span>${opt.text}</span>
                `;
                btn.dataset.type = opt.type;
                btn.addEventListener('click', () => selectOption(index, opt.type));
                optionsContainer.appendChild(btn);
            });

            const total = QUESTIONS.length;
            const pct = ((index + 1) / total) * 100;
            progressFill.style.width = pct + '%';
            progressText.textContent = `${index + 1} / ${total}`;

            prevBtn.disabled = index === 0;
            // 下一题按钮永远可用（但自动跳转已生效，保留手动功能）
            nextBtn.disabled = false;
            // 如果是最后一题，改变文字
            if (index === total - 1) {
                nextBtn.textContent = '查看结果';
                // 如果最后一题已选，点击可查看结果，否则提示
            } else {
                nextBtn.textContent = '下一题';
            }
        }

        function selectOption(index, type) {
            // 如果已经选中该选项，则取消选中（不跳转）
            if (state.answers[index] === type) {
                state.answers[index] = null;
                recalcScores();
                renderQuestion(index);
                return;
            }

            // 否则选中新选项
            state.answers[index] = type;
            recalcScores();
            renderQuestion(index);

            // 自动跳转：如果当前不是最后一题，跳转到下一题；如果是最后一题，自动显示结果
            const total = QUESTIONS.length;
            if (index === total - 1) {
                // 最后一题选完自动显示结果
                renderResult();
            } else {
                // 自动跳转到下一题
                goTo(index + 1);
            }
        }

        function recalcScores() {
            state.scores = { A: 0, B: 0, C: 0, D: 0 };
            state.answers.forEach((ans) => {
                if (ans && state.scores.hasOwnProperty(ans)) {
                    state.scores[ans] += 1;
                }
            });
        }

        // ================================================================

            const scores = state.scores;
            const total = QUESTIONS.length;
            const pcts = {
                A: Math.round((scores.A / total) * 100),
                B: Math.round((scores.B / total) * 100),
                C: Math.round((scores.C / total) * 100),
                D: Math.round((scores.D / total) * 100)
            };

            let maxType = 'A';
            let maxVal = scores.A;
            for (const [key, val] of Object.entries(scores)) {
                if (val > maxVal) { maxVal = val;
                    maxType = key; }
            }
            const mainType = maxType;
            const info = TYPE_INFO[mainType];

            const labels = {
                A: '依赖·安全',
                B: '激情·浪漫',
                C: '友谊·平和',
                D: '现实·契约'
            };
            const colors = {
                A: 'a',
                B: 'b',
                C: 'c',
                D: 'd'
            };
            chartContainer.innerHTML = '';
            for (const [key, label] of Object.entries(labels)) {
                const pct = pcts[key];
                const row = document.createElement('div');
                row.className = 'chart-row';
                row.innerHTML = `
                    <span class="chart-label">${label}</span>
                    <div class="chart-bar-bg">
                        <div class="chart-bar-fill ${colors[key]}" style="width: ${pct}%;"></div>

                    <span class="chart-value">${pct}%</span>
                `;

            mainTypeBadge.textContent = `${info.emoji} ${info.label}`;
            mainTypeBadge.className = `main-type-badge ${info.color}`;

                </p>
                <p style="font-size:13px; color:#a0808e; margin-top:6px;">
                    ⚡ 真正的成熟之爱，是在安全感、激情、友谊和责任之间找到动态平衡。
                </p>
            `;

            showResult();
            state.isFinished = true;
        }

        // ================================================================
        //  8. 导航事件
        // ================================================================
        function goTo(index) {
            if (index < 0 || index >= QUESTIONS.length) return;
            state.current = index;
            renderQuestion(index);
            questionArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function goNext() {
            const cur = state.current;
            const total = QUESTIONS.length;
            if (cur === total - 1) {
                // 最后一题：如果已选则显示结果，否则提示
                if (state.answers[cur] !== null) {
                    renderResult();
                } else {
                    // 简单提示用户选择
                    alert('请先选择当前题目的选项。');
                }
                return;
            }
            goTo(cur + 1);
        }

        function goPrev() {
            if (state.current > 0) {
                goTo(state.current - 1);
            }
        }

        function resetAndGoHome() {
            state.current = 0;
            state.answers = new Array(30).fill(null);
            state.scores = { A: 0, B: 0, C: 0, D: 0 };
            state.isFinished = false;
            showHome();
            // 重置进度条
            progressFill.style.width = '0%';
            progressText.textContent = '0 / 30';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startTest() {
            // 重置状态（如果之前有残留）
            state.answers = new Array(30).fill(null);
            state.scores = { A: 0, B: 0, C: 0, D: 0 };
            state.current = 0;
            state.isFinished = false;
            showTest();
            renderQuestion(0);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ================================================================
        //  9. 绑定事件 & 初始化
        // ================================================================
        startBtn.addEventListener('click', startTest);
        prevBtn.addEventListener('click', goPrev);
        nextBtn.addEventListener('click', goNext);
        restartBtn.addEventListener('click', resetAndGoHome);

        // 键盘支持（桌面辅助）
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                if (!nextBtn.disabled) goNext();
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (!prevBtn.disabled) goPrev();
            }
            if (e.key >= '1' && e.key <= '4') {
                const idx = parseInt(e.key) - 1;
                const currentQ = QUESTIONS[state.current];
                if (currentQ && currentQ.options[idx]) {
                    const type = currentQ.options[idx].type;
                    selectOption(state.current, type);
                }
            }
        });

        // 初始显示主页
        showHome();
    </script>
</body>
</html>
