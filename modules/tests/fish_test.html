<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🐠 水族宠物适性测试</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #e6f7f9 0%, #c8e8ed 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .test-container {
            max-width: 780px;
            width: 100%;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0, 60, 80, 0.18), 0 8px 24px rgba(0, 40, 50, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .test-container::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(98, 210, 255, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }
        .test-container::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 200, 180, 0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        .header .icon-big {
            font-size: 52px;
            display: block;
            margin-bottom: 6px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header h1 {
            font-size: 30px;
            font-weight: 700;
            color: #0b3b4a;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .header .subhead {
            font-size: 16px;
            color: #3f6e7a;
            background: rgba(150, 210, 220, 0.25);
            display: inline-block;
            padding: 4px 20px;
            border-radius: 40px;
            font-weight: 500;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header .timer-badge {
            margin-top: 12px;
            font-size: 14px;
            color: #2b5f6b;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 18px;
            border-radius: 40px;
            display: inline-block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .header .timer-badge span { font-weight: 600; }

        /* ===== 首页样式 ===== */
        .home-page {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px 0 10px;
            animation: fadeUp 0.6s ease;
        }

        .home-page .home-icon {
            font-size: 72px;
            display: block;
            margin-bottom: 6px;
        }

        .home-page .home-title {
            font-size: 28px;
            font-weight: 700;
            color: #08313b;
            margin-bottom: 8px;
        }

        .home-page .home-desc {
            font-size: 17px;
            color: #1f4e59;
            line-height: 1.7;
            max-width: 600px;
            margin: 0 auto 20px;
        }

        .home-features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 20px;
            margin: 16px 0 28px;
        }

        .home-features .feature {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 15px;
            color: #1f5a66;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .home-features .feature span {
            margin-right: 6px;
        }

        .btn-start {
            background: linear-gradient(135deg, #29b7c7, #138b9e);
            color: white;
            border: none;
            padding: 16px 56px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(44, 193, 208, 0.3);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(44, 193, 208, 0.4);
            background: linear-gradient(135deg, #30c9da, #159bb0);
        }

        .btn-start:active { transform: scale(0.96); }

        /* ===== 进度条 ===== */
        .progress-wrap {
            margin: 18px 0 28px 0;
            position: relative;
            z-index: 1;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(160, 200, 210, 0.3);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.06);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2cc1d0, #0f9bb0);
            border-radius: 40px;
            transition: width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 0 12px rgba(44, 193, 208, 0.3);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #2a5f6a;
            margin-top: 6px;
            font-weight: 500;
        }
        .progress-label .qnum {
            background: rgba(44, 193, 208, 0.12);
            padding: 0 12px;
            border-radius: 20px;
        }

        /* ===== 题目区域 ===== */
        .question-area {
            position: relative;
            z-index: 1;
            min-height: 340px;
            transition: opacity 0.3s ease;
        }

        .question-text {
            font-size: 22px;
            font-weight: 600;
            color: #0a3540;
            margin-bottom: 24px;
            line-height: 1.4;
            padding: 0 4px;
        }
        .question-text .q-emoji { margin-right: 8px; }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .option-item {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1.5px solid rgba(180, 215, 225, 0.3);
            border-radius: 20px;
            padding: 16px 22px;
            font-size: 17px;
            color: #16454f;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            font-weight: 500;
        }

        .option-item:hover {
            background: rgba(255, 255, 255, 0.85);
            border-color: #66c2d0;
            transform: translateX(4px);
            box-shadow: 0 6px 18px rgba(44, 193, 208, 0.12);
        }

        .option-item:active { transform: scale(0.98); }

        .option-item .opt-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(44, 193, 208, 0.12);
            color: #0f7b8a;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .option-item:hover .opt-letter { background: rgba(44, 193, 208, 0.25); }
        .option-item .opt-text { flex: 1; }

        /* ===== 结果区域 ===== */
        .result-area {
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .result-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 32px 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 60, 80, 0.08);
        }

        .result-emoji { font-size: 64px; text-align: center; display: block; margin-bottom: 6px; }
        .result-title { font-size: 28px; font-weight: 700; color: #08313b; text-align: center; margin-bottom: 4px; }
        .result-sub {
            text-align: center;
            font-size: 16px;
            color: #336b78;
            font-weight: 500;
            margin-bottom: 18px;
            background: rgba(44, 193, 208, 0.08);
            padding: 4px 16px;
            border-radius: 40px;
            display: inline-block;
            margin-left: auto;
            margin-right: auto;
            width: fit-content;
        }

        .result-desc {
            font-size: 16px;
            line-height: 1.7;
            color: #1f4e59;
            margin: 14px 0 16px 0;
            background: rgba(255, 255, 255, 0.3);
            padding: 16px 20px;
            border-radius: 20px;
            border-left: 4px solid #3dc0ce;
        }

        .result-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin: 12px 0 18px 0;
            justify-content: center;
        }
        .result-tags span {
            background: rgba(44, 193, 208, 0.12);
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 14px;
            color: #125f6b;
            font-weight: 500;
            border: 1px solid rgba(44, 193, 208, 0.15);
        }

        .result-care {
            background: rgba(255, 248, 225, 0.5);
            border-radius: 16px;
            padding: 14px 18px;
            margin: 10px 0 16px 0;
            font-size: 15px;
            color: #3f5e46;
            border: 1px solid rgba(200, 180, 120, 0.2);
        }
        .result-care strong { color: #2a6b3a; }

        .result-score {
            text-align: center;
            font-size: 15px;
            color: #1c6b78;
            background: rgba(44, 193, 208, 0.08);
            padding: 6px 16px;
            border-radius: 40px;
            display: inline-block;
            margin: 6px auto 12px;
            border: 1px dashed rgba(44, 193, 208, 0.3);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 12px;
        }

        .btn {
            padding: 12px 34px;
            border-radius: 60px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            background: #dceef2;
            color: #0d4b57;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #29b7c7, #138b9e);
            color: white;
            border: none;
            box-shadow: 0 6px 20px rgba(44, 193, 208, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(44, 193, 208, 0.3);
            background: linear-gradient(135deg, #30c9da, #159bb0);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #6baebd;
            color: #1f6a78;
        }
        .btn-outline:hover {
            background: rgba(44, 193, 208, 0.06);
            border-color: #3c9bae;
        }

        .btn:active { transform: scale(0.96); }

        /* ===== 隐藏工具 ===== */
        .hidden {
            display: none !important;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .test-container { padding: 28px 18px; border-radius: 32px; }
            .header h1 { font-size: 24px; }
            .question-text { font-size: 19px; }
            .option-item { padding: 14px 16px; font-size: 15px; }
            .result-card { padding: 24px 18px; }
            .result-title { font-size: 22px; }
            .result-emoji { font-size: 48px; }
            .btn { padding: 10px 24px; font-size: 15px; width: 100%; justify-content: center; }
            .btn-group { flex-direction: column; }
            .btn-start { padding: 14px 36px; font-size: 18px; width: 100%; }
            .home-features .feature { font-size: 13px; padding: 6px 14px; }
        }

        @media (max-width: 420px) {
            .test-container { padding: 20px 14px; }
            .option-item { padding: 12px 14px; gap: 10px; }
            .option-item .opt-letter { width: 26px; height: 26px; font-size: 12px; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.02); }
        ::-webkit-scrollbar-thumb { background: #8ccbd6; border-radius: 10px; }
    </style>
</head>
<body>

<div class="test-container" id="app">
    <!-- 头部 -->
    <div class="header">
        <span class="icon-big">🐚</span>
        <h1>水族宠物适性测试</h1>
        <div class="timer-badge">⏱️ 推荐时长 <span>15~20</span> 分钟 · 共 30 题</div>
    </div>

    <!-- ===== 首页 ===== -->
    <div id="homePage" class="home-page">
        <span class="home-icon">🐠</span>
        <div class="home-title">找到属于你的水中伙伴</div>
        <button class="btn-start" id="startBtn">🚀 开始测试</button>
    </div>

    <!-- ===== 进度条 ===== -->
    <div class="progress-wrap hidden" id="progressWrap">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-label">
            <span class="qnum" id="qNumLabel">1 / 30</span>
            <span id="progressPercent">0%</span>
        </div>
    </div>

    <!-- ===== 题目 / 结果区域 ===== -->
    <div class="question-area hidden" id="questionArea"></div>
</div>

<script>
    // ================================================================
    //  1. 30道趣味情境题（完全不直接提及“鱼/水族”）
    //     每题权重 1~3
    // ================================================================

    const questions = [
        // —— 生活方式 & 时间投入 ——
        { id: 0, emoji: '🌅', weight: 2, text: '周末早晨你通常怎么度过？',
          options: [
            { label: '睡到自然醒，慢悠悠享受早餐', value: 'A' },
            { label: '早起运动或出门散步', value: 'B' },
            { label: '打理家务、整理房间', value: 'C' },
            { label: '约朋友一起喝早茶或聚会', value: 'D' }
          ] },
        { id: 1, emoji: '📅', weight: 2, text: '你的日常工作/学习节奏是？',
          options: [
            { label: '朝九晚五，规律稳定', value: 'A' },
            { label: '自由职业，时间灵活', value: 'B' },
            { label: '经常加班，但能掌控', value: 'C' },
            { label: '忙闲不定，随任务变化', value: 'D' }
          ] },
        { id: 2, emoji: '🎯', weight: 2, text: '你每天能留给自己完全放松的时间大概有多久？',
          options: [
            { label: '不到半小时', value: 'A' },
            { label: '半小时到一小时', value: 'B' },
            { label: '一到两小时', value: 'C' },
            { label: '两小时以上', value: 'D' }
          ] },
        { id: 3, emoji: '✈️', weight: 1, text: '你出远门（旅行/出差）的频率是？',
          options: [
            { label: '很少，一年一两次', value: 'A' },
            { label: '偶尔，三四次', value: 'B' },
            { label: '经常，每月都有', value: 'C' },
            { label: '几乎都在路上', value: 'D' }
          ] },

        // —— 审美偏好 ——
        { id: 4, emoji: '🎨', weight: 2, text: '你更偏爱哪种色彩组合？',
          options: [
            { label: '蓝白灰的冷色调', value: 'A' },
            { label: '橙红黄的暖色调', value: 'B' },
            { label: '大地色系（棕、米、绿）', value: 'C' },
            { label: '高饱和度的撞色', value: 'D' }
          ] },
        { id: 5, emoji: '🛋️', weight: 2, text: '你理想中的家居风格是？',
          options: [
            { label: '极简现代，干净利落', value: 'A' },
            { label: '自然田园，有绿植和原木', value: 'B' },
            { label: '复古轻奢，带金属装饰', value: 'C' },
            { label: '工业风，裸露砖墙和管道', value: 'D' }
          ] },
        { id: 6, emoji: '🖼️', weight: 2, text: '你更喜欢哪种艺术表达形式？',
          options: [
            { label: '写实风景画', value: 'A' },
            { label: '抽象表现主义', value: 'B' },
            { label: '街头涂鸦', value: 'C' },
            { label: '极简线条画', value: 'D' }
          ] },
        { id: 7, emoji: '🌊', weight: 1, text: '你更向往哪种自然环境？',
          options: [
            { label: '静谧的湖畔或森林', value: 'A' },
            { label: '金色的沙滩和海洋', value: 'B' },
            { label: '巍峨的山脉', value: 'C' },
            { label: '繁华的都市公园', value: 'D' }
          ] },

        // —— 性格特点 ——
        { id: 8, emoji: '🧠', weight: 3, text: '遇到棘手问题时，你的第一反应是？',
          options: [
            { label: '冷静分析，列计划', value: 'A' },
            { label: '马上找人帮忙', value: 'B' },
            { label: '凭直觉快速行动', value: 'C' },
            { label: '先放一放，等灵感', value: 'D' }
          ] },
        { id: 9, emoji: '🤝', weight: 2, text: '你在社交场合中通常扮演什么角色？',
          options: [
            { label: '倾听者，很少主动说话', value: 'A' },
            { label: '温和的参与者', value: 'B' },
            { label: '活跃的气氛制造者', value: 'C' },
            { label: '组织者，掌控节奏', value: 'D' }
          ] },
        { id: 10, emoji: '🧘', weight: 2, text: '你的耐性如何？',
          options: [
            { label: '非常有耐心，能等很久', value: 'A' },
            { label: '一般，可以等但会焦虑', value: 'B' },
            { label: '不太有耐心，喜欢即时的反馈', value: 'C' },
            { label: '分情况，对喜欢的事很耐心', value: 'D' }
          ] },
        { id: 11, emoji: '💪', weight: 2, text: '你更倾向于哪种决策风格？',
          options: [
            { label: '深思熟虑，权衡利弊', value: 'A' },
            { label: '跟随内心感觉', value: 'B' },
            { label: '参考多数人的意见', value: 'C' },
            { label: '果断拍板，不犹豫', value: 'D' }
          ] },

        // —— 经济预算 ——
        { id: 12, emoji: '💸', weight: 3, text: '你每个月的“非必要消费”预算大概是多少？',
          options: [
            { label: '500元以内', value: 'A' },
            { label: '500~1500元', value: 'B' },
            { label: '1500~4000元', value: 'C' },
            { label: '4000元以上', value: 'D' }
          ] },
        { id: 13, emoji: '🛍️', weight: 2, text: '你购买心仪物品时最看重什么？',
          options: [
            { label: '性价比，实用为主', value: 'A' },
            { label: '品质和耐用性', value: 'B' },
            { label: '设计感和独特性', value: 'C' },
            { label: '品牌和社交属性', value: 'D' }
          ] },
        { id: 14, emoji: '📦', weight: 2, text: '你愿意为一项爱好一次性投入多少启动资金？',
          options: [
            { label: '500元以内', value: 'A' },
            { label: '500~2000元', value: 'B' },
            { label: '2000~8000元', value: 'C' },
            { label: '8000元以上', value: 'D' }
          ] },

        // —— 空间条件 ——
        { id: 15, emoji: '🏠', weight: 3, text: '你目前的居住空间大小是？',
          options: [
            { label: '单间 / 30㎡以下', value: 'A' },
            { label: '一居室 / 30~60㎡', value: 'B' },
            { label: '两居室 / 60~100㎡', value: 'C' },
            { label: '大户型 / 100㎡以上', value: 'D' }
          ] },
        { id: 16, emoji: '🪴', weight: 2, text: '你家里有专门的“放松角落”吗？',
          options: [
            { label: '没有，空间都利用满了', value: 'A' },
            { label: '有，但很小', value: 'B' },
            { label: '有，比较宽敞', value: 'C' },
            { label: '有，而且很大，可以自由改造', value: 'D' }
          ] },
        { id: 17, emoji: '🧹', weight: 1, text: '你平时对整理收纳的态度是？',
          options: [
            { label: '喜欢整洁，定期大扫除', value: 'A' },
            { label: '保持基本不乱', value: 'B' },
            { label: '有点随性，但不过分', value: 'C' },
            { label: '完全放飞，开心就好', value: 'D' }

    function renderQuestion(index) {

            return `
                <div class="option-item" data-value="${opt.value}">
                    <span class="opt-letter">${letter}</span>
                    <span class="opt-text">${opt.label}</span>
                </div>
            `;
        }).join('');

        const html = `
            <div class="question-text">
                <span class="q-emoji">${q.emoji}</span>

            if (finalScore > bestFinalScore) {
                bestFinalScore = finalScore;
                bestPet = { ...pet, matchPercent: Math.round(finalScore) };
            }
        }
        return bestPet;
    }

    function showResult() {
        const result = calculateResult();

        progressFill.style.width = '100%';
        qNumLabel.textContent = '🎉 完成！';
        progressPercent.textContent = '100%';

        const html = `
            <div class="result-area">
                <div class="result-card">
                    <span class="result-emoji">${result.emoji}</span>
                    <div class="result-title">${result.title}</div>
                    <div class="result-sub">${result.subtitle}</div>
                    <div class="result-score">🏅 匹配度 ${result.matchPercent}% · 含通用性加权</div>
                    <div class="result-desc">${result.description}</div>
                    <div class="result-tags">
                        ${result.tags.map(t => `<span>${t}</span>`).join('')}
                    </div>
                    <div class="result-care">${result.care}</div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="restartTest()">🔄 重新测试</button>
                        <button class="btn btn-outline" onclick="window.print()">🖨️ 保存结果</button>
                    </div>
                </div>
            </div>
        `;

        questionArea.innerHTML = html;
        document.querySelector('.test-container').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ================================================================
    //  6. 重新开始（回到首页）
    // ================================================================

    function restartTest() {
        answers.length = 0;
        currentQuestion = 0;
        // 回到首页
        homePage.classList.remove('hidden');
        progressWrap.classList.add('hidden');
        questionArea.classList.add('hidden');
        // 重置进度条
        progressFill.style.width = '0%';
        qNumLabel.textContent = '1 / 30';
        progressPercent.textContent = '0%';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ================================================================
    //  7. 绑定事件 & 初始化
    // ================================================================

    startBtn.addEventListener('click', startTest);

    // 初始状态：首页显示，进度条和题目区隐藏（已在HTML中设置hidden）
    // 无需额外操作
</script>
</body>
</html>
