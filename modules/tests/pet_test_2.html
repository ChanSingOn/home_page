<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #f7f2ea 0%, #e8dfd3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(60, 40, 20, 0.15), 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        #home {
            text-align: center;
        }

        #home .logo {
            font-size: 72px;
            margin-bottom: 8px;
            display: block;
        }

        #home h1 {
            font-size: 32px;
            font-weight: 700;
            color: #2d3e1f;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        #home .subtitle {
            font-size: 18px;
            color: #6b5a4a;
            font-weight: 400;
            margin-bottom: 20px;
        }

        #home .desc {
            font-size: 15px;
            color: #7a6a5a;
            line-height: 1.8;
            max-width: 480px;
            margin: 0 auto 28px;
        }

        #home .desc strong {
            color: #4a6a2a;
        }

        .btn-primary {
            background: #4a7a2a;
            color: #fff;
            border: none;
            padding: 16px 52px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(74, 122, 42, 0.3);
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            background: #3a6422;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(74, 122, 42, 0.35);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: transparent;
            color: #6b5a4a;
            border: 2px solid #d4c8b8;
            padding: 12px 32px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: #f0e8de;
            border-color: #b8a898;
        }

        .btn-secondary:active {
            transform: scale(0.97);
        }

        .btn-small {
            padding: 8px 20px;
            font-size: 13px;
        }

        #quiz {
            display: none;
        }

        .progress-wrap {
            margin-bottom: 28px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #7a6a5a;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 6px;
            background: #e8ddd0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7aaa4a, #4a7a2a);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .question-number {
            font-size: 13px;
            font-weight: 600;
            color: #9a8a7a;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            color: #2d3e1f;
            line-height: 1.6;
            margin-bottom: 28px;
            min-height: 60px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 16px 22px;
            background: #f8f4ef;
            border: 2px solid transparent;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            color: #3d3a35;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            position: relative;
        }

        .option-btn:hover:not(.disabled) {
            background: #f0e8de;
            border-color: #c8b8a8;
            transform: translateX(4px);
        }

        .option-btn.selected {
            background: #eaf3e0;
            border-color: #4a7a2a;
            box-shadow: 0 4px 16px rgba(74, 122, 42, 0.15);
        }

        .option-btn .letter {
            display: inline-block;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            background: #e8ddd0;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 700;
            color: #6b5a4a;
            margin-right: 14px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .option-btn.selected .letter {
            background: #4a7a2a;
            color: #fff;
        }

        .option-btn .text {
            display: inline;
        }

        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .nav-row .left {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-row .right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-nav {
            background: transparent;
            border: 1.5px solid #d4c8b8;
            border-radius: 40px;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 500;
            color: #6b5a4a;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-nav:hover:not(:disabled) {
            background: #f0e8de;
            border-color: #b8a898;
        }

        .btn-nav:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn-nav.primary {
            background: #4a7a2a;
            border-color: #4a7a2a;
            color: #fff;
        }

        .btn-nav.primary:hover:not(:disabled) {
            background: #3a6422;
            border-color: #3a6422;
        }

        .btn-nav.primary:disabled {
            opacity: 0.4;
        }

        .counter {
            font-size: 14px;
            color: #9a8a7a;
            font-weight: 500;
            padding: 0 4px;
        }

        #result {

        }

        .result-badge {
            text-align: center;
            margin-bottom: 24px;
        }

            display: block;
            line-height: 1.2;
        }

            font-weight: 700;
            color: #2d3e1f;
            margin-top: 4px;

        .result-badge .result-title {
            font-size: 18px;
            color: #6b5a4a;
            font-weight: 400;
        }

        .result-divider {

            height: 4px;
            background: linear-gradient(90deg, #7aaa4a, #4a7a2a);
            border-radius: 4px;
            margin: 16px auto 24px;
        }

        .result-detail {
            color: #3d3a35;
            font-size: 15px;
            line-height: 1.8;
        }

        .result-detail p {
            margin-bottom: 14px;
        }

        .result-detail .trait-list {
            list-style: none;
            padding: 0;
            margin: 12px 0 20px;
        }

            background-size: 18px;
            color: #3d3a35;
        }

        .result-detail .stars {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 12px 0 16px;
            font-size: 18px;
            color: #f5b342;
        }

        .result-detail .stars span {
            font-size: 15px;
            color: #6b5a4a;
            font-weight: 500;
            margin-left: 4px;
        }

        .result-detail .advice-box {
            background: #f4efe8;
            border-radius: 18px;
            padding: 18px 22px;
            margin-top: 16px;
            border-left: 4px solid #4a7a2a;
        }

        .result-detail .advice-box strong {
            color: #2d3e1f;
        }

        .result-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .tie-break {
            text-align: center;
            margin: 12px 0 18px;
        }

        .tie-break .tie-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 12px;
        }

        .tie-break .tie-btn {
            background: #f8f4ef;
            border: 2px solid #d4c8b8;
            border-radius: 20px;
            padding: 14px 24px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tie-break .tie-btn:hover {
            background: #eaf3e0;
            border-color: #4a7a2a;
            transform: translateY(-2px);
        }

        .tie-break .tie-btn .emoji {
            font-size: 28px;
        }

        .tie-break .tie-btn .label {
            font-weight: 500;
            color: #2d3e1f;
        }

        @media (max-width: 600px) {
            .card {
                padding: 28px 20px;
                border-radius: 28px;
            }

            #home h1 {
                font-size: 26px;
            }

            #home .logo {
                font-size: 56px;
            }

            .question-text {
                font-size: 17px;
                min-height: 44px;
            }

            .option-btn {
                padding: 14px 16px;
                font-size: 14px;
                border-radius: 14px;
            }

            .option-btn .letter {
                width: 24px;
                height: 24px;
                line-height: 24px;
                font-size: 12px;
                margin-right: 10px;
            }

            .nav-row {
                flex-wrap: wrap;
                gap: 10px;
            }

            .nav-row .left,
            .nav-row .right {
                flex: 1 1 auto;
            }

            .btn-nav {
                padding: 8px 16px;
                font-size: 13px;
            }

            .result-badge .big-emoji {
                font-size: 60px;
            }

            .result-badge .result-name {
                font-size: 22px;
            }

            .tie-break .tie-btn {
                padding: 10px 16px;
                font-size: 14px;
            }

            .result-actions {
                flex-direction: column;
                align-items: center;
            }

            .result-actions .btn-primary,
            .result-actions .btn-secondary {
                width: 100%;
                text-align: center;
                justify-content: center;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 20px 14px;
                border-radius: 20px;
            }

            .question-text {
                font-size: 15px;
            }

            .option-btn {
                padding: 12px 12px;
                font-size: 13px;
            }
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-in {
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f0ebe4;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c8b8a8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #b0a090;
        }
    </style>
</head>
<body>

    <div class="app-container">

                <button class="btn-secondary" id="shareBtn">📋 复制结果</button>

        // ================================================================
        //  3. 应用状态
        // ================================================================

        const state = {
            currentIndex: 0,
            answers: new Array(QUESTIONS.length).fill(null), // 存储选项索引 (0-3)
        };

        // ================================================================
        //  4. DOM 引用
        // ================================================================

        const $home = document.getElementById('home');
        const $quiz = document.getElementById('quiz');
        const $result = document.getElementById('result');

        const $startBtn = document.getElementById('startBtn');
        const $prevBtn = document.getElementById('prevBtn');
        const $nextBtn = document.getElementById('nextBtn');
        const $resultBtn = document.getElementById('resultBtn');
        const $retryBtn = document.getElementById('retryBtn');
        const $shareBtn = document.getElementById('shareBtn');

        const $progressLabel = document.getElementById('progressLabel');
        const $progressPercent = document.getElementById('progressPercent');
        const $progressFill = document.getElementById('progressFill');
        const $qNumber = document.getElementById('qNumber');
        const $qText = document.getElementById('qText');
        const $optionsContainer = document.getElementById('optionsContainer');
        const $counterDisplay = document.getElementById('counterDisplay');

        const $rEmoji = document.getElementById('rEmoji');
        const $rName = document.getElementById('rName');
        const $rTitle = document.getElementById('rTitle');
        const $rDetail = document.getElementById('rDetail');

        // ================================================================
        //  5. 核心逻辑
        // ================================================================

        // 动态获取类型：根据题目索引和选项索引计算
        function getTypeForOption(qIndex, optIndex) {
            const totalTypes = TYPES.length;
            const idx = (qIndex * 4 + optIndex) % totalTypes;
            return TYPES[idx];
        }

        function renderQuestion() {
            const q = QUESTIONS[state.currentIndex];
            const idx = state.currentIndex;
            const total = QUESTIONS.length;

            const pct = Math.round(((idx) / total) * 100);
            $progressFill.style.width = pct + '%';
            $progressPercent.textContent = pct + '%';
            $progressLabel.textContent = `第 ${idx + 1} / ${total} 题`;

            $qNumber.textContent = `问题 ${String(idx + 1).padStart(2, '0')}`;
            $qText.textContent = q.text;

            $optionsContainer.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((optText, oi) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (state.answers[idx] === oi) {
                    btn.classList.add('selected');
                }
                btn.innerHTML = `
                    <span class="letter">${letters[oi]}</span>
                    <span class="text">${optText}</span>
                `;
                btn.dataset.index = oi;
                btn.addEventListener('click', () => handleOptionClick(oi));
                $optionsContainer.appendChild(btn);
            });

            $prevBtn.disabled = idx === 0;
            $counterDisplay.textContent = `${idx + 1} / ${total}`;

            if (idx === total - 1) {
                $nextBtn.classList.add('hidden');
                $resultBtn.classList.remove('hidden');
                $resultBtn.disabled = state.answers[idx] === null;
            } else {
                $nextBtn.classList.remove('hidden');
                $resultBtn.classList.add('hidden');
                $nextBtn.disabled = state.answers[idx] === null;
            }

            $qText.parentElement.classList.remove('slide-in');
            void $qText.parentElement.offsetWidth;
            $qText.parentElement.classList.add('slide-in');
        }

        function handleOptionClick(optIndex) {
            const idx = state.currentIndex;
            state.answers[idx] = optIndex;

            const btns = $optionsContainer.querySelectorAll('.option-btn');
            btns.forEach((btn, i) => {
                btn.classList.toggle('selected', i === optIndex);
            });

            if (idx === QUESTIONS.length - 1) {
                $resultBtn.disabled = false;
            } else {
                $nextBtn.disabled = false;
                // 自动前进（用户可修改）
                setTimeout(() => {
                    goToNext();
                }, 280);
            }
        }

        function goToNext() {
            if (state.currentIndex < QUESTIONS.length - 1) {
                state.currentIndex++;
                renderQuestion();
                document.querySelector('.app-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function goToPrev() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                renderQuestion();
                document.querySelector('.app-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function calculateResult() {
            const scores = {};
            TYPES.forEach(t => scores[t] = 0);

            for (let i = 0; i < QUESTIONS.length; i++) {
                const ansIdx = state.answers[i];
                if (ansIdx === null) continue;
                const type = getTypeForOption(i, ansIdx);
                if (scores[type] !== undefined) {
                    scores[type]++;
                }
            }

            let maxScore = 0;
            let topTypes = [];
            for (const [type, score] of Object.entries(scores)) {
                if (score > maxScore) {
                    maxScore = score;
                    topTypes = [type];
                } else if (score === maxScore && score > 0) {
                    topTypes.push(type);
                }
            }

            if (topTypes.length === 0 || maxScore === 0) {
                return ['守宫']; // fallback
            }
            return topTypes;
        }

        function showResult() {
            const topTypes = calculateResult();

            if (topTypes.length === 1) {
                renderSingleResult(topTypes[0]);
            } else {
                renderTieResult(topTypes);
            }

            $home.style.display = 'none';
            $quiz.style.display = 'none';
            $result.style.display = 'block';
            $result.classList.remove('fade-in');
            void $result.offsetWidth;
            $result.classList.add('fade-in');
            document.querySelector('.app-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderSingleResult(type) {
            const data = RESULT_DATA[type];
            if (!data) return;

            $rEmoji.textContent = data.emoji;
            $rName.textContent = data.name;
            $rTitle.textContent = data.title;

            let starsHtml = '';
            for (let i = 0; i < data.stars; i++) starsHtml += '⭐';
            starsHtml += `<span>${data.stars} 星适配</span>`;

            let traitsHtml = data.traits.map(t => `<li>${t}</li>`).join('');

            $rDetail.innerHTML = `
                <p><strong>你的特质：</strong></p>
                <ul class="trait-list">${traitsHtml}</ul>
                <div class="stars">${starsHtml}</div>
                <div class="advice-box">
                    <strong>💡 相处建议：</strong> ${data.advice}
                </div>
                <p style="margin-top:16px; font-size:14px; color:#8a7a6a; text-align:center;">
                    🧡 你与 ${data.emoji} ${data.name} 有着天然的契合度。
                </p>
            `;
        }

        function renderTieResult(types) {
            let html = `
                <div class="tie-break">
                    <p style="font-size:16px; color:#5a4a3a; margin-bottom:6px;">
                        🤔 你的性格有多重特质，有 <strong>${types.length}</strong> 种异宠与你适配！
                    </p>
                    <p style="font-size:14px; color:#8a7a6a; margin-bottom:16px;">
                        选择你最心动的那一个，查看详细解读 👇
                    </p>
                    <div class="tie-options">
            `;
            types.forEach(type => {
                const data = RESULT_DATA[type];
                html += `
                    <button class="tie-btn" data-type="${type}">
                        <span class="emoji">${data.emoji}</span>
                        <span class="label">${data.name}</span>
                        <span style="font-size:13px; color:#8a7a6a;">· ${data.title}</span>
                    </button>
                `;
            });
            html += `
                    </div>
                </div>
                <div style="text-align:center; margin-top:8px; font-size:13px; color:#b0a090;">
                    👆 点击选择后查看完整解读
                </div>
            `;

            $rEmoji.textContent = '🌟';
            $rName.textContent = '多重适配';
            $rTitle.textContent = '你拥有多元的灵魂';
            $rDetail.innerHTML = html;

            document.querySelectorAll('.tie-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const type = this.dataset.type;
                    renderSingleResult(type);
                    const data = RESULT_DATA[type];
                    $rEmoji.textContent = data.emoji;
                    $rName.textContent = data.name;
                    $rTitle.textContent = data.title;
                });
            });
        }

        function resetTest() {
            state.currentIndex = 0;
            state.answers = new Array(QUESTIONS.length).fill(null);

            $home.style.display = 'block';
            $quiz.style.display = 'none';
            $result.style.display = 'none';

            $progressFill.style.width = '0%';
            $progressPercent.textContent = '0%';
            $prevBtn.disabled = true;
            $nextBtn.disabled = true;
            $nextBtn.classList.remove('hidden');
            $resultBtn.classList.add('hidden');
            $resultBtn.disabled = true;

            document.querySelector('.app-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ================================================================
        //  6. 事件绑定
        // ================================================================

        $startBtn.addEventListener('click', () => {
            $home.style.display = 'none';
            $quiz.style.display = 'block';
            $quiz.classList.remove('fade-in');
            void $quiz.offsetWidth;
            $quiz.classList.add('fade-in');
            renderQuestion();
            document.querySelector('.app-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        $prevBtn.addEventListener('click', goToPrev);
        $nextBtn.addEventListener('click', goToNext);
        $resultBtn.addEventListener('click', showResult);
        $retryBtn.addEventListener('click', resetTest);

        $shareBtn.addEventListener('click', function() {
            const type = $rName.textContent;
            const emoji = $rEmoji.textContent;
            const title = $rTitle.textContent;
            const text =
                `🦎 我的异宠适性测试结果：${emoji} ${type}（${title}）\n来测测你适合养哪种异宠吧！`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    const orig = this.textContent;
                    this.textContent = '✅ 已复制！';
                    setTimeout(() => { this.textContent = orig; }, 2000);
                }).catch(() => {
                    fallbackCopy(text, this);
                });
            } else {
                fallbackCopy(text, this);
            }
        });

        function fallbackCopy(text, btn) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                const orig = btn.textContent;
                btn.textContent = '✅ 已复制！';
                setTimeout(() => { btn.textContent = orig; }, 2000);
            } catch (e) {
                alert('复制失败，请手动复制：\n' + text);
            }
            document.body.removeChild(ta);
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if ($quiz.style.display === 'block') {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goToPrev();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    if (state.currentIndex === QUESTIONS.length - 1) {
                        if (!$resultBtn.disabled) showResult();
                    } else {
                        goToNext();
                    }
                }
            }
        });

        // 初始化
        $home.style.display = 'block';
        $quiz.style.display = 'none';
        $result.style.display = 'none';

        console.log('🦎 异宠适性测试 · 15种异宠已加载！');
    </script>

</body>
</html>
