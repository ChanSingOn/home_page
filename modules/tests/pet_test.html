    // ---------- 状态 ----------
    let currentIndex = 0;
    const totalQuestions = QUESTIONS.length;
    const scores = new Array(ANIMALS.length).fill(0);
    const answers = new Array(totalQuestions).fill(null);

    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const progressText = document.getElementById('progressText');
    const progressFill = document.getElementById('progressFill');
    const progressPercent = document.getElementById('progressPercent');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const questionArea = document.getElementById('questionArea');
    const resultArea = document.getElementById('resultArea');
    const podiumContainer = document.getElementById('podiumContainer');
    const chartContainer = document.getElementById('chartContainer');

    function renderQuestion(index) {
        const q = QUESTIONS[index];
        questionText.textContent = q.question;
        optionsContainer.innerHTML = '';
        const selectedIdx = answers[index];

        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            if (selectedIdx !== null && i === selectedIdx) {
                btn.classList.add('selected');
            }
            const letter = String.fromCharCode(65 + i);
            btn.innerHTML = `<span class="letter">${letter}</span> ${opt.text}`;
            btn.dataset.index = i;
            btn.addEventListener('click', () => handleOptionClick(index, i));
            optionsContainer.appendChild(btn);
        });

        const pct = ((index + 1) / totalQuestions * 100);
        progressText.textContent = `${index + 1} / ${totalQuestions}`;
        progressFill.style.width = pct + '%';
        progressPercent.textContent = Math.round(pct) + '%';

        prevBtn.disabled = (index === 0);
        nextBtn.disabled = false;
        if (index === totalQuestions - 1) {
            nextBtn.textContent = '查看结果 🎉';
        } else {
            nextBtn.textContent = '下一题 →';
        }
    }

    function handleOptionClick(qIndex, optIndex) {
        if (answers[qIndex] !== null) {
            const oldAnimalIdx = QUESTIONS[qIndex].options[answers[qIndex]].animalIndex;
            scores[oldAnimalIdx] -= 1;
        }
        answers[qIndex] = optIndex;
        const animalIdx = QUESTIONS[qIndex].options[optIndex].animalIndex;
        scores[animalIdx] += 1;

        renderQuestion(qIndex);

        if (qIndex === totalQuestions - 1) {
            showResults();
        } else {
            currentIndex = qIndex + 1;
            renderQuestion(currentIndex);
        }
    }

    function goToPrev() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion(currentIndex);
        }
    }

    function goToNext() {
        if (answers[currentIndex] === null) {
            alert('请先选择一个选项再继续哦~');
            return;
        }
        if (currentIndex === totalQuestions - 1) {
            showResults();
        } else {
            currentIndex++;
            renderQuestion(currentIndex);
        }
    }

    function showResults() {
        questionArea.style.display = 'none';
        resultArea.style.display = 'block';

        const ranked = ANIMALS.map((animal, idx) => ({
            ...animal,
            score: scores[idx],
            index: idx
        })).sort((a, b) => b.score - a.score);

        const top3 = ranked.slice(0, 3);
        const podiumHtml = top3.map((item, rank) => {
            const rankLabel = rank === 0 ? '🥇 第一名' : rank === 1 ? '🥈 第二名' : '🥉 第三名';
            const cls = rank === 0 ? 'first' : rank === 1 ? 'second' : 'third';
            const desc = DESCRIPTIONS[item.id];
            if (!desc) return '';
            return `
                <div class="podium-item ${cls}">
                    <div class="podium-rank">${rankLabel} · 得分 ${item.score}</div>
                    <div class="podium-name">${item.emoji} ${item.name}</div>
                    <div class="podium-desc"><strong>✨ 适合你：</strong>${desc.good}</div>
                    ${desc.bad ? `<div class="podium-desc" style="margin-top:6px;background:#f5ece4;"><strong>⚠️ 注意：</strong>${desc.bad}</div>` : ''}
                </div>
            `;
        }).join('');
        podiumContainer.innerHTML = podiumHtml;

        const maxScore = Math.max(...scores, 1);
        const chartRows = ranked.map(item => {
            const pct = (item.score / maxScore * 100).toFixed(1);
            return `
                <div class="chart-row">
                    <div class="chart-label">${item.emoji} ${item.name}</div>
                    <div class="chart-bar-bg">
                        <div class="chart-bar" style="width:${pct}%; background:${item.color};"></div>
                    </div>
                    <div class="chart-score">${item.score}</div>
                </div>
            `;
        }).join('');
        chartContainer.innerHTML = `<div style="font-weight:600;color:#4d3425;margin-bottom:12px;">📊 各宠物得分</div>` + chartRows;

        const avg = scores.reduce((a,b)=>a+b,0) / ANIMALS.length;
        const lowThreshold = avg * 0.5;
        const lowAnimals = ranked.filter(item => item.score < lowThreshold && item.score > 0);
        if (lowAnimals.length > 0) {
            const warn = lowAnimals.map(a => `${a.emoji}${a.name}`).join('、');
            const warnDiv = document.createElement('div');
            warnDiv.style.marginTop = '16px';
            warnDiv.style.padding = '14px 18px';
            warnDiv.style.background = '#f7e4da';
            warnDiv.style.borderRadius = '24px';
            warnDiv.style.color = '#5d3a2a';
            warnDiv.innerHTML = `💡 <strong>提示：</strong> 你对 ${warn} 的得分较低，可能不太适合养这类宠物哦。`;
            document.getElementById('podiumContainer').appendChild(warnDiv);
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    prevBtn.addEventListener('click', goToPrev);
    nextBtn.addEventListener('click', goToNext);

    renderQuestion(0);
</script>
