<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🦜 鸟类适性测试 · 你适合养什么鸟？</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #f7f3e9 0%, #e8e0d5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== 主容器 ===== */
        .container {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 252, 245, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 40px 44px 48px;
            box-shadow: 0 30px 60px rgba(100, 70, 40, 0.18), 0 12px 28px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 245, 230, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 200, 120, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .container::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(180, 210, 240, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ===== 首页样式 ===== */
        #home {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .logo-icon {
            font-size: 72px;
            display: block;
            margin-bottom: 6px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            color: #4a3728;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        h1 span {
            background: linear-gradient(135deg, #d48c5c, #b5724a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 18px;
            color: #7a6a5a;
            margin-bottom: 20px;
            line-height: 1.6;
            font-weight: 400;
        }

        .subtitle em {
            font-style: normal;
            color: #b5724a;
            font-weight: 500;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 28px 0 32px;
            text-align: left;
        }

        .feature-item {
            background: rgba(245, 235, 220, 0.5);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: #4a3728;
            border: 1px solid rgba(200, 175, 150, 0.2);
            backdrop-filter: blur(4px);
        }

        .feature-item .icon {
            font-size: 22px;
            flex-shrink: 0;
        }

        .btn-start {
            background: linear-gradient(135deg, #d48c5c, #b5724a);
            color: #fff;
            border: none;
            padding: 18px 56px;
            font-size: 22px;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(180, 110, 60, 0.3);
            letter-spacing: 0.5px;
            margin-top: 8px;
            position: relative;
            z-index: 2;
        }

        .btn-start:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 14px 32px rgba(180, 110, 60, 0.35);
        }

        .btn-start:active {
            transform: scale(0.97);
        }

        .test-meta {
            margin-top: 24px;
            font-size: 14px;
            color: #9a8a7a;
            display: flex;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
        }

        .test-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== 测试页样式 ===== */
        #quiz {
            display: none;
            position: relative;
            z-index: 2;
        }

        /* 测试页大标题 */
        .quiz-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(200, 175, 150, 0.2);
        }

        .quiz-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #4a3728;
            letter-spacing: 1px;
        }

        .quiz-header h2 span {
            background: linear-gradient(135deg, #d48c5c, #b5724a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .quiz-header .progress-label {
            font-size: 15px;
            color: #7a6a5a;
            margin-top: 4px;
            font-weight: 500;
        }

        .progress-section {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .progress-bar-bg {
            flex: 1;
            height: 8px;
            background: #e8ddd0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.06);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d48c5c, #c47a4a);
            border-radius: 12px;
            transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .progress-text {
            font-size: 15px;
            font-weight: 500;
            color: #7a6a5a;
            min-width: 58px;
            text-align: right;
            letter-spacing: 0.3px;
        }

        .question-number {
            font-size: 14px;
            color: #b09a88;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 22px;
            font-weight: 600;
            color: #3d2c1e;
            line-height: 1.5;
            margin-bottom: 28px;
            min-height: 68px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(250, 245, 235, 0.7);
            border: 2px solid #e8ddd0;
            border-radius: 18px;
            padding: 18px 22px;
            font-size: 16px;
            color: #3d2c1e;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(4px);
            font-weight: 450;
            line-height: 1.4;
            min-height: 64px;
        }

        .option-btn:hover {
            background: rgba(235, 220, 200, 0.6);
            border-color: #c4a88a;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(140, 100, 70, 0.08);
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .option-btn .opt-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e8ddd0;
            color: #5a4a3a;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .option-btn:hover .opt-label {
            background: #d4c0b0;
            color: #3d2c1e;
        }

        .option-btn.selected {
            border-color: #b5724a;
            background: rgba(210, 170, 130, 0.2);
            box-shadow: 0 0 0 4px rgba(180, 110, 60, 0.08);
        }

        .option-btn.selected .opt-label {
            background: #b5724a;
            color: #fff;
        }

        /* ===== 导航按钮区域 ===== */
        .nav-buttons {
            display: flex;
            gap: 14px;
            margin-top: 18px;
        }

        .nav-btn {
            flex: 1;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .nav-btn:active {
            transform: scale(0.97);
        }

        .nav-btn-prev {
            background: rgba(235, 220, 200, 0.5);
            border: 2px solid #d4c0b0;
            color: #4a3728;
        }

        .nav-btn-prev:hover:not(:disabled) {
            background: rgba(215, 195, 175, 0.5);
            border-color: #b5724a;
            transform: translateY(-2px);
        }

        .nav-btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .nav-btn-next {
            background: linear-gradient(135deg, #d48c5c, #b5724a);
            color: #fff;
            box-shadow: 0 6px 20px rgba(180, 110, 60, 0.25);
        }

        .nav-btn-next:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(180, 110, 60, 0.3);
        }

        .nav-btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }

        /* ===== 结果页样式 ===== */
        #result {
            display: none;
            position: relative;
            z-index: 2;
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .result-emoji {
            font-size: 72px;
            display: block;
            margin-bottom: 4px;
        }

        .result-title {
            font-size: 30px;
            font-weight: 700;
            color: #3d2c1e;
            margin-bottom: 4px;
        }

        .result-sub {
            font-size: 18px;
            color: #7a6a5a;
            font-weight: 400;
        }

        .result-bird-card {
            background: rgba(250, 245, 235, 0.6);
            border-radius: 28px;
            padding: 28px 32px;
            border: 1px solid rgba(200, 175, 150, 0.2);
            margin-bottom: 24px;
            backdrop-filter: blur(6px);
        }

        .result-bird-name {
            font-size: 26px;
            font-weight: 700;
            color: #3d2c1e;
            margin-bottom: 6px;
        }

        .result-bird-name small {
            font-size: 16px;
            font-weight: 400;
            color: #9a8a7a;
            margin-left: 10px;
        }

        .result-bird-desc {
            font-size: 16px;
            color: #5a4a3a;
            line-height: 1.7;
            margin-bottom: 14px;
        }

        .result-bird-traits {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .trait-tag {
            background: rgba(200, 175, 150, 0.2);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 14px;
            color: #5a4a3a;
            border: 1px solid rgba(180, 150, 120, 0.15);
        }

        .match-section {
            margin: 20px 0 18px;
        }

        .match-bar-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }

        .match-bar-label {
            font-size: 14px;
            color: #7a6a5a;
            min-width: 70px;
            font-weight: 500;
        }

        .match-bar-bg {
            flex: 1;
            height: 6px;
            background: #e8ddd0;
            border-radius: 12px;
            overflow: hidden;
        }

        .match-bar-fill {
            height: 100%;
            border-radius: 12px;
            background: linear-gradient(90deg, #d48c5c, #b5724a);
            width: 0%;
            transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .match-bar-pct {
            font-size: 15px;
            font-weight: 600;
            color: #4a3728;
            min-width: 44px;
            text-align: right;
        }

        .result-advice {
            background: rgba(235, 220, 200, 0.25);
            border-radius: 18px;
            padding: 18px 24px;
            border-left: 4px solid #b5724a;
            margin: 16px 0 22px;
            font-size: 15px;
            color: #4a3a2a;
            line-height: 1.6;
        }

        .result-advice strong {
            color: #b5724a;
        }

        .result-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-secondary {
            background: rgba(235, 220, 200, 0.5);
            border: 2px solid #d4c0b0;
            color: #4a3728;
            padding: 14px 34px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .btn-secondary:hover {
            background: rgba(215, 195, 175, 0.5);
            border-color: #b5724a;
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #d48c5c, #b5724a);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(180, 110, 60, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(180, 110, 60, 0.3);
        }

        /* ===== 其他鸟类匹配 ===== */
        .other-birds {
            margin-top: 28px;
            border-top: 1px solid rgba(200, 175, 150, 0.2);
            padding-top: 22px;
        }

        .other-birds-title {
            font-size: 16px;
            color: #7a6a5a;
            margin-bottom: 14px;
            font-weight: 500;
            text-align: center;
        }

        .other-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .other-item {
            background: rgba(250, 245, 235, 0.4);
            border-radius: 16px;
            padding: 12px 14px;
            text-align: center;
            border: 1px solid rgba(200, 175, 150, 0.1);
            transition: all 0.2s;
        }

        .other-item .o-emoji {
            font-size: 30px;
            display: block;
        }

        .other-item .o-name {
            font-size: 14px;
            font-weight: 500;
            color: #4a3728;
            margin-top: 2px;
        }

        .other-item .o-pct {
            font-size: 13px;
            color: #9a8a7a;
        }

        .other-item .o-bar-bg {
            height: 4px;
            background: #e8ddd0;
            border-radius: 8px;
            margin-top: 6px;
            overflow: hidden;
        }

        .other-item .o-bar-fill {
            height: 100%;
            background: #c4a88a;
            border-radius: 8px;
            width: 0%;
            transition: width 1s ease;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .container {
                padding: 28px 20px 32px;
                border-radius: 32px;
            }

            h1 {
                font-size: 28px;
            }

            .quiz-header h2 {
                font-size: 22px;
            }

            .question-text {
                font-size: 18px;
                min-height: 52px;
            }

            .options-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .option-btn {
                padding: 14px 18px;
                font-size: 15px;
                min-height: 54px;
            }

            .feature-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .feature-item {
                font-size: 13px;
                padding: 10px 12px;
            }

            .btn-start {
                padding: 16px 40px;
                font-size: 19px;
                width: 100%;
            }

            .result-bird-card {
                padding: 20px 18px;
            }

            .result-title {
                font-size: 24px;
            }

            .test-meta {
                gap: 14px;
                font-size: 13px;
                flex-wrap: wrap;
            }

            .other-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .result-actions {
                flex-direction: column;
            }

            .result-actions button {
                width: 100%;
                justify-content: center;
            }

            .nav-buttons {
                flex-direction: column;
                gap: 10px;
            }

            .nav-btn {
                width: 100%;
                padding: 14px;
                font-size: 16px;
            }
        }

        @media (max-width: 420px) {
            .container {
                padding: 20px 14px 24px;
                border-radius: 24px;
            }

            .feature-grid {
                grid-template-columns: 1fr;
            }

            .question-text {
                font-size: 17px;
            }
        }

        /* ===== 工具类 ===== */
        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f0e8dc;
            border-radius: 12px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c4a88a;
            border-radius: 12px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #b5724a;
        }

        /* ===== 轻提示 ===== */
        .hint-msg {
            text-align: center;
            color: #b5724a;
            font-size: 14px;
            font-weight: 500;
            margin-top: 8px;
            animation: fadeInOut 1.8s ease forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-6px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-6px); }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- ====== 首页 ====== -->
        <div id="home">
            <span class="logo-icon">🦜</span>
            <h1>鸟类适性 <span>测试</span></h1>
            <p class="subtitle">
                找到与你 <em>灵魂契合</em> 的那只鸟伙伴
            </p>

            <button class="btn-start" onclick="startTest()">开始测试 </button>

        </div>

        <!-- ====== 测试页 ====== -->
        <div id="quiz">
            <!-- 大标题 -->
            <div class="quiz-header">
                <h2>🦜 鸟类适性 <span>测试</span></h2>
                <div class="progress-label" id="progressLabel">第 1 / 36 题</div>
            </div>

            <div class="progress-section">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <span class="progress-text" id="progressText">0 / 36</span>
            </div>

            <div class="question-number" id="questionNumber">第 1 题</div>
            <div class="question-text" id="questionText">加载题目中…</div>

            <div class="options-grid" id="optionsContainer"></div>

            <!-- 导航按钮区域 -->
            <div class="nav-buttons">
                <button class="nav-btn nav-btn-prev" id="btnPrev" onclick="prevQuestion()" disabled>
                   上一题
                </button>
                <button class="nav-btn nav-btn-next" id="btnNext" onclick="nextQuestion()" disabled>
                    下一题
                </button>
            </div>
        </div>

        <!-- ====== 结果页 ====== -->
        <div id="result">
            <div class="result-header">
                <span class="result-emoji" id="resultEmoji">🦜</span>
                <div class="result-title" id="resultTitle">你的灵魂鸟伙伴</div>
                <div class="result-sub" id="resultSub">根据你的生活特质，我们推荐：</div>
            </div>

            <div class="result-bird-card">
                <div class="result-bird-name" id="resultBirdName">虎皮鹦鹉 <small>Budgerigar</small></div>
                <div class="result-bird-desc" id="resultBirdDesc">活泼可爱，适应力强，是新手入门的绝佳选择。</div>
                <div class="result-bird-traits" id="resultTraits"></div>

                <div class="match-section">
                    <div class="match-bar-wrap">
                        <span class="match-bar-label">匹配度</span>
                        <div class="match-bar-bg">
                            <div class="match-bar-fill" id="matchBarFill" style="width:0%"></div>
                        </div>
                        <span class="match-bar-pct" id="matchPct">0%</span>
                    </div>
                </div>

                <div class="result-advice" id="resultAdvice">
                    <strong>💡 饲养贴士：</strong> 虎皮鹦鹉活泼好动，需要较大的活动空间和丰富的玩具，每天至少半小时的互动时间。
                </div>
            </div>

            <div class="result-actions">
                <button class="btn-secondary" onclick="retest()">🔄 重新测试</button>
                <button class="btn-primary" onclick="shareResult()">📤 分享结果</button>
            </div>

            <div class="other-birds">
                <div class="other-birds-title">📊 其他适合你的鸟类</div>
                <div class="other-grid" id="otherGrid"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  1. 鸟类数据（15种）
        // ============================================================
        const BIRDS = {
            budgie: {
                id: 'budgie',
                name: '虎皮鹦鹉',
                emoji: '🐦',
                latin: 'Budgerigar',

            options: [
                { text: '积极沟通，寻求共识', bird: 'quaker' },
                { text: '妥协退让，维持和谐', bird: 'cockatiel' },
                { text: '坚持己见，但尊重对方', bird: 'leiothrix' },
                { text: '回避冲突，让时间解决', bird: 'java' }
            ]
        }, {
            text: '你更喜欢哪种艺术形式？',
            options: [
                { text: '音乐，尤其是旋律优美的', bird: 'myna' },
                { text: '绘画，色彩和构图', bird: 'sun' },
                { text: '文学，故事和文字', bird: 'grey' },
                { text: '舞蹈，节奏和肢体表达', bird: 'budgie' }
            ]
        }, {
            text: '你对「挑战」的态度是——',
            options: [
                { text: '喜欢挑战，越难越有动力', bird: 'quaker' },
                { text: '接受挑战，但需要充分准备', bird: 'hwamei' },
                { text: '不喜欢挑战，喜欢舒适区', bird: 'java' },
                { text: '偶尔挑战，但不会强求', bird: 'cockatiel' }
            ]
        }, {
            text: '你希望你的宠物——',
            options: [
                { text: '能和你一起看电视、听音乐', bird: 'lovebird' },
                { text: '能自己玩耍，不需要你时刻关注', bird: 'zebrafinch' },
                { text: '能和你互动游戏，比如接物、学动作', bird: 'quaker' },
                { text: '能在你身边安静地陪伴', bird: 'cockatiel' }
            ]
        }, {
            text: '你对自己的「创造力」评价是——',
            options: [
                { text: '很有创造力，喜欢设计和创作', bird: 'sun' },
                { text: '有一定创造力，喜欢尝试新事物', bird: 'budgie' },
                { text: '创造力一般，但欣赏别人的创意', bird: 'society' },
                { text: '务实型，不太关注创造力', bird: 'java' }
            ]
        }, {
            text: '你更看重「过程」还是「结果」？',
            options: [
                { text: '享受过程，结果不重要', bird: 'lovebird' },
                { text: '重视结果，但也会享受过程', bird: 'quaker' },
                { text: '结果最重要，过程可以忽略', bird: 'gouldian' },
                { text: '过程和结果都重要，平衡看待', bird: 'cockatiel' }
            ]
        }, {
            text: '你对「自然」的亲近程度是——',
            options: [
                { text: '非常喜欢自然，经常去户外', bird: 'leiothrix' },
                { text: '喜欢自然，但更习惯城市生活', bird: 'budgie' },
                { text: '对自然无感，喜欢室内环境', bird: 'java' },
                { text: '欣赏自然，但不会刻意亲近', bird: 'cockatiel' }
            ]
        }, {
            text: '你平时如何做决定？',
            options: [
                { text: '凭直觉，跟着感觉走', bird: 'lovebird' },
                { text: '理性分析，权衡利弊', bird: 'whiteeye' },
                { text: '咨询他人意见，再做决定', bird: 'quaker' },
                { text: '随遇而安，不太纠结', bird: 'java' }
            ]
        }, {
            text: '你更喜欢哪种宠物互动方式？',
            options: [
                { text: '用手轻轻抚摸和拥抱', bird: 'lovebird' },
                { text: '用玩具和食物进行互动', bird: 'quaker' },
                { text: '安静地待在一起，各自做各自的事', bird: 'myna' },
                { text: '用语言和声音交流', bird: 'grey' }
            ]
        }, {
            text: '你对「养宠物」这件事的总体态度是——',
            options: [
                { text: '已经做好准备，愿意承担所有责任', bird: 'hwamei' },
                { text: '期待已久，充满热情和信心', bird: 'budgie' },
                { text: '认真考虑过，愿意为宠物改变生活', bird: 'cockatiel' },
                { text: '随缘，遇到合适的就养', bird: 'java' }
            ]
        }];

        // ============================================================
        //  3. 测试逻辑
        // ============================================================
        let currentQ = 0;
        let scores = {};
        let answers = []; // 存储每道题选择的 bird id
        let autoTimer = null; // 自动跳转定时器
        let totalQuestions = QUESTIONS.length;

        function initScores() {
            scores = {};
            BIRD_IDS.forEach(id => { scores[id] = 0; });
            answers = new Array(totalQuestions).fill(null);
        }

        function startTest() {
            document.getElementById('home').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            initScores();
            currentQ = 0;
            if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;
            }
            renderQuestion();
        }

        function renderQuestion() {
            const q = QUESTIONS[currentQ];
            document.getElementById('questionNumber').textContent = `第 ${currentQ + 1} 题`;
            document.getElementById('questionText').textContent = q.text;

            // 更新大标题下的进度标签
            document.getElementById('progressLabel').textContent = `第 ${currentQ + 1} / ${totalQuestions} 题`;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="opt-label">${labels[idx]}</span> ${opt.text}`;
                btn.dataset.bird = opt.bird;
                btn.onclick = () => selectOption(btn, opt.bird);
                container.appendChild(btn);
            });

            // 恢复之前的选择（如果有）
            const prevAnswer = answers[currentQ];
            if (prevAnswer) {
                const btns = container.querySelectorAll('.option-btn');
                btns.forEach(btn => {
                    if (btn.dataset.bird === prevAnswer) {
                        btn.classList.add('selected');
                    }
                });
            }

            // 更新进度
            updateProgress();

            // 更新导航按钮状态
            const prevBtn = document.getElementById('btnPrev');
            const nextBtn = document.getElementById('btnNext');

            prevBtn.disabled = (currentQ === 0);

            // 下一题按钮：根据当前题是否有答案启用
            if (answers[currentQ]) {
                nextBtn.disabled = false;
                nextBtn.textContent = currentQ === totalQuestions - 1 ? '🎉 查看结果' : '下一题';
            } else {
                nextBtn.disabled = true;
                nextBtn.textContent = currentQ === totalQuestions - 1 ? '🎉 查看结果' : '下一题';
            }

            // 清除自动跳转定时器
            if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;
            }
        }

        function selectOption(btn, birdId) {
            // 取消同组其他选中
            const container = document.getElementById('optionsContainer');
            container.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');

            // 保存答案
            answers[currentQ] = birdId;

            // 更新下一题按钮状态
            const nextBtn = document.getElementById('btnNext');
            nextBtn.disabled = false;
            nextBtn.textContent = currentQ === totalQuestions - 1 ? '🎉 查看结果' : '下一题';

            // 清除之前的定时器
            if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;
            }

            // 自动跳转（延迟 350ms）
            autoTimer = setTimeout(() => {
                autoTimer = null;
                goToNext();
            }, 350);
        }

        function goToNext() {
            if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;
            }

            if (!answers[currentQ]) {
                return;
            }

            // 重新计算分数（确保分数准确）
            recalcScores();

            if (currentQ < totalQuestions - 1) {
                currentQ++;
                renderQuestion();
            } else {
                showResult();
            }
        }

        function goToPrev() {
            if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;
            }
            if (currentQ > 0) {
                currentQ--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (answers[currentQ]) {
                goToNext();
            } else {
                // 提示用户选择
                const nextBtn = document.getElementById('btnNext');
                nextBtn.style.transform = 'scale(0.95)';
                setTimeout(() => { nextBtn.style.transform = ''; }, 200);
                const msg = document.createElement('div');
                msg.className = 'hint-msg';
                msg.textContent = '👆 请先选择一个选项';
                const existing = document.querySelector('.hint-msg');
                if (existing) existing.remove();
                const nav = document.querySelector('.nav-buttons');
                nav.parentNode.insertBefore(msg, nav.nextSibling);
                setTimeout(() => { if (msg.parentNode) msg.remove(); }, 1800);
            }
        }

        function prevQuestion() {
            goToPrev();
        }

        function recalcScores() {
            initScores();
            for (let i = 0; i < answers.length; i++) {
                const birdId = answers[i];
                if (birdId) {
                    scores[birdId] = (scores[birdId] || 0) + 1;
                }
            }
        }

        function updateProgress() {
            const pct = ((currentQ) / totalQuestions) * 100;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = `${currentQ} / ${totalQuestions}`;
        }

        // ============================================================
        //  4. 结果展示
        // ============================================================
        function showResult() {
            recalcScores();

            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'block';

            let sorted = BIRD_IDS.map(id => ({ id, score: scores[id] || 0 }));
            sorted.sort((a, b) => b.score - a.score);

            const top = sorted[0];
            const topBird = BIRDS[top.id];
            const totalAnswered = answers.filter(a => a !== null).length;
            const avgScore = totalAnswered / BIRD_IDS.length;
            let matchPct = Math.round((top.score / (avgScore || 1)) * 50 + 30);
            if (matchPct > 98) matchPct = 98;
            if (matchPct < 30) matchPct = 30;

            document.getElementById('resultEmoji').textContent = topBird.emoji;
            document.getElementById('resultTitle').textContent = `你最适合养 · ${topBird.name}`;
            document.getElementById('resultSub').textContent = `根据你的特质，匹配度最高的鸟类`;

            document.getElementById('resultBirdName').innerHTML =
                `${topBird.name} <small>${topBird.latin}</small>`;
            document.getElementById('resultBirdDesc').textContent = topBird.desc;

            const traitsContainer = document.getElementById('resultTraits');
            traitsContainer.innerHTML = topBird.traits.map(t =>
                `<span class="trait-tag">#${t}</span>`
            ).join('');

            document.getElementById('matchBarFill').style.width = matchPct + '%';
            document.getElementById('matchPct').textContent = matchPct + '%';

            document.getElementById('resultAdvice').innerHTML =
                `<strong>💡 饲养贴士：</strong> ${topBird.advice}`;

            // 其他鸟类
            const otherGrid = document.getElementById('otherGrid');
            otherGrid.innerHTML = '';
            const others = sorted.slice(1);
            const maxScore = sorted[0].score || 1;
            others.forEach((item, idx) => {
                const bird = BIRDS[item.id];
                let pct = Math.round((item.score / maxScore) * 100);
                if (pct < 5) pct = 5;
                const div = document.createElement('div');
                div.className = 'other-item';
                div.innerHTML = `
                    <span class="o-emoji">${bird.emoji}</span>
                    <div class="o-name">${bird.name}</div>
                    <div class="o-pct">${pct}%</div>
                    <div class="o-bar-bg">
                        <div class="o-bar-fill" style="width:${pct}%"></div>
                    </div>
                `;
                setTimeout(() => {
                    const fill = div.querySelector('.o-bar-fill');
                    fill.style.width = pct + '%';
                }, 100 + idx * 50);
                otherGrid.appendChild(div);
            });

            document.querySelector('.container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ============================================================
        //  5. 辅助功能
        // ============================================================
        function retest() {
            document.getElementById('result').style.display = 'none';
            document.getElementById('home').style.display = 'block';
            document.querySelector('.container').scrollIntoView({ behavior: 'smooth', block: 'start' });
            if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;
            }
        }

        function shareResult() {
            const birdName = document.getElementById('resultTitle').textContent;
            const pct = document.getElementById('matchPct').textContent;
            const text = `🦜 我做了「鸟类适性测试」，结果是 ${birdName}，匹配度 ${pct}！你也来测测吧～ https://chansingon.github.io/home_page/modules/tests/bird_test.html`;
            if (navigator.share) {
                navigator.share({ title: '鸟类适性测试', text }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    alert('✅ 结果已复制到剪贴板，分享给朋友吧！');
                }).catch(() => {
                    prompt('复制以下内容分享：', text);
                });
            }
        }

        // 键盘支持
        document.addEventListener('keydown', (e) => {
            const key = parseInt(e.key);
            if (key >= 1 && key <= 4) {
                const btns = document.querySelectorAll('.option-btn');
                if (btns[key - 1]) btns[key - 1].click();
            }
            if (e.key === 'Enter') {
                const nextBtn = document.getElementById('btnNext');
                if (!nextBtn.disabled) nextBtn.click();
            }
            if (e.key === 'ArrowLeft' || e.key === 'Backspace') {
                const prevBtn = document.getElementById('btnPrev');
                if (!prevBtn.disabled) prevBtn.click();
                e.preventDefault();
            }
            if (e.key === 'ArrowRight') {
                const nextBtn = document.getElementById('btnNext');
                if (!nextBtn.disabled) nextBtn.click();
                e.preventDefault();
            }
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('home').style.display = 'block';
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('result').style.display = 'none';
        });
    </script>
